name: Native platform evidence

# When this lane runs is owned by ci.yml, not by a path filter here.
#
# The filter used to list only packages/runtime-native/**, so a change to core,
# playtest, create-threenative or native-smoke — every package the native app
# actually bundles — could break these targets with nothing reporting it. On
# 2026-08-11 three separate reds on main turned out to be stale for exactly that
# reason. Path filters also fired push and pull_request together, running the
# whole 24-minute matrix twice per PR.
#
# This file is a reusable workflow called by ci.yml, where the `native-platforms` job is a required
# member of the primary board. Manual dispatch remains available for an isolated platform run.
on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: "Run only the iOS simulator and consumer handoff job"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      selection_plan:
        description: Validated caller selection; empty manual calls fail safe to full coverage.
        type: string
        default: ""
      candidate_sha:
        description: Immutable source commit captured once by CI scope.
        type: string
        default: ""
      ios_only:
        required: false
        type: boolean
        default: false
    outputs:
      coverage_receipt:
        description: Exact current-attempt supported native leg join.
        value: ${{ jobs.completion.outputs.coverage_receipt }}

concurrency:
  group: native-platforms-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  # Superseded PR runs are dead weight — cancel them. A push to main is not supersession: this
  # lane exists to produce platform evidence, and at this repository's push cadence (~20 minutes)
  # against this lane's runtime (27-45 minutes) cancel-in-progress killed every main run before
  # it finished — 37 of the last 100 cancelled, none of the platform legs ever reported on the
  # branch that claims them. Main runs queue instead; a queued evidence run is late, a cancelled
  # one is absent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: the run-cancel-on-failure step that needed Actions write access is gone — it re-marked
# the failing job itself `cancelled`, which hid which leg went red. See ci.yml.
permissions:
  contents: read
  actions: read

jobs:
  # The caller is the single selection authority. Dispatch has no exemption inputs and is full.
  scope:
    name: Validate caller selection and candidate
    # PRD-480. `github.event` inside a `workflow_call` is the caller's event payload, so this
    # expression reads the same `pull_request` fork flag ci.yml did when it called this file: a fork
    # PR falls through to hosted runners and never reaches the owner's machine.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      selection: ${{ steps.classify.outputs.selection }}
      reason: ${{ steps.classify.outputs.reason }}
      plan: ${{ steps.classify.outputs.plan }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
      # PRD-380 phase 2: `full` for a main push, the nightly, an explicit audit, a merge group or pull
      # request into main; `reduced` for an ordinary pull request, which runs the Linux rows only.
      native_tier: ${{ steps.classify.outputs.native_tier }}
      starter_rows: ${{ steps.rows.outputs.starter_rows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - id: classify
        env:
          TN_CI_PLAN: ${{ inputs.selection_plan }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          if [ -n "$TN_CI_PLAN" ]; then
            node scripts/ci-change-scope.mjs --validate-plan "$TN_CI_PLAN" --format github > "$RUNNER_TEMP/ci-scope.outputs"
          else
            node scripts/ci-change-scope.mjs --full --candidate-sha "$candidate" --format github > "$RUNNER_TEMP/ci-scope.outputs"
          fi
          grep -Fx "candidate_sha=$candidate" "$RUNNER_TEMP/ci-scope.outputs"
          cat "$RUNNER_TEMP/ci-scope.outputs" >> "$GITHUB_OUTPUT"
      # A job's `if` cannot read `matrix` (GitHub's context table lists github, needs, vars and
      # inputs there), so a row an ordinary pull request does not owe is dropped by shaping the
      # matrix instead. x64 and arm64 run the identical release-container proof; the arm64 leg is
      # GitHub's free hosted `ubuntu-24.04-arm` runner, because there is no V8 or Dawn prebuilt for
      # Linux arm64 (kuoruan/libv8 ships Linux x64 only; Dawn's ubuntu-latest asset is x64) and a
      # source V8 build is not allowed in CI — so that host is built with QuickJS over wgpu-native,
      # the one WebGPU backend publishing an arm64 Linux archive, which scripts/download-deps.mjs
      # and scripts/native-build.mjs select from `process.arch`. A reduced run keeps x64 alone, and
      # x64 routes through the same TN_RUNNER switch every other movable Linux job uses (PRD-480).
      - id: rows
        env:
          TN_NATIVE_TIER: ${{ steps.classify.outputs.native_tier }}
        run: |
          set -euo pipefail
          node -e '
            const rows = [
              { platform: "linux-x64", runner: "${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}" },
              { platform: "linux-arm64", runner: "ubuntu-24.04-arm" },
            ];
            // Reduced only when the tier says so: an unreadable tier keeps every row.
            const reduced = process.env.TN_NATIVE_TIER === "reduced";
            // A keyed object, never a bare array. GitHub expands `strategy.matrix` from an axis
            // vector or from `include`, and run 37100382876 wrote the array: the rows were set, the
            // step passed, and `starter-linux` never started — no job, no error — while the reusable
            // workflow still concluded failure, so `ci-required` read a red native lane with every
            // leg green. `{"include":[…]}` is the same two rows in the shape GitHub expands.
            process.stdout.write(`starter_rows=${JSON.stringify({ include: reduced ? rows.slice(0, 1) : rows })}\n`);
          ' >> "$GITHUB_OUTPUT"

  web-reference:
    needs: scope
    name: Commit-keyed web conformance reference
    # Ungated on pull requests with android-emulator-parity, which needs this reference to compare
    # against and would otherwise skip with it. desktop-parity also needs it; a
    # skipped dependant does not force this job to run, so the cost here is one browser capture on
    # pull requests that previously ran none. The prose-only scope skip is unrelated and kept.
    if: >-
      needs.scope.outputs.selection == 'full' &&
      inputs.ios_only == false
    # Keep this platform prerequisite out of the local queue during CI/Integration bursts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Called from ci.yml this is the same run as `build-artifacts`, which already holds the one
      # reservation this key allows; a standalone dispatch has no such job, so this job is the run's
      # only saver either way. The other two consumers are restore-only.
      - uses: ./.github/actions/workspace-dist
        with:
          save-bundles: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: ./.github/actions/playwright-chromium
      - name: Capture commit-keyed browser reference
        run: |
          set +e
          sh scripts/xvfb.sh node packages/runtime-native/conformance/run-conformance.mjs --target web --out artifacts/conformance/web
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "web reference"
      # Uploaded even when the capture step fails, and that changes no verdict: this job still
      # reports its own red, and a consumer whose `needs` failed still skips. What it changes is
      # that the red becomes diagnosable. `report.json` is written before the exit test, so on a
      # failing run the one artifact naming which row failed existed and was thrown away — which is
      # why "web-reference is red" has been readable for three runs on main without anyone being
      # able to say what failed.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-web-reference-${{ needs.scope.outputs.candidate_sha }}
          path: packages/runtime-native/artifacts/conformance/web
          if-no-files-found: error

  android-v8-source:
    name: Android V8 source payload
    needs: scope
    if: needs.scope.outputs.selection == 'full' && inputs.ios_only != true
    # Keep this platform prerequisite out of the local queue during CI/Integration bursts.
    runs-on: ubuntu-24.04
    # 180-minute build ceiling plus 30 minutes for actions/cache/save, per the action's note.
    timeout-minutes: 210
    outputs:
      recipe-hash: ${{ steps.v8.outputs.recipe-hash }}
      published: ${{ steps.v8.outputs.published }}
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # `packages:` is explicit because the action's default is `tools platform-tools`, and
      # Google removed the obsolete `tools` package from the SDK repository: the default
      # now fails the whole step with `Failed to find package 'tools'`.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      # Install the pinned NDK on the selected runner. Caching it previously took 90 seconds
      # and a GB-scale share of the cache budget.
      - name: Install and select the pinned Android NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - id: v8
        uses: ./.github/actions/android-v8-source
      - uses: actions/upload-artifact@v7
        with:
          name: android-v8-${{ needs.scope.outputs.candidate_sha }}
          path: packages/runtime-native/third_party/v8-android
          if-no-files-found: error
          retention-days: 2

  # Publishes a freshly built payload as the release asset every later run downloads instead of
  # building V8 for two hours. Trusted refs only: a pull request's code never runs in a job holding a
  # token that can write releases, and this job checks nothing out. A PR that changes the V8 recipe
  # builds its own payload; dispatch this workflow on develop after it merges to publish the new one
  # before the nightly does.
  publish-android-v8:
    name: Publish the Android V8 payload
    needs: [scope, android-v8-source]
    if: >-
      needs.android-v8-source.outputs.published == 'false' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # PRD-480 leaves this one on GitHub's machines: it is the release write itself — `contents:
    # write` and a `gh release upload` below — and no pool container is handed a token that can
    # publish. It is named on the hosted allow-list in ci-structure.spec.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-v8-${{ needs.scope.outputs.candidate_sha }}
          path: v8-android
      - name: Upload the payload to the ci-v8-android release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: v8-android-${{ needs.android-v8-source.outputs.recipe-hash }}.tgz
          TARGET: ${{ needs.scope.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          tar -czf "$ASSET" -C v8-android .
          gh release view ci-v8-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create ci-v8-android --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
              --prerelease --latest=false --title "CI cache: Android V8 payload" \
              --notes "Built Android V8 payloads, one asset per recipe hash, for CI to download instead of rebuilding. Not a product release."
          gh release upload ci-v8-android "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  performance-coverage:
    name: Native collector evidence coverage
    needs: [scope, android-emulator-parity, desktop-parity, desktop, ios-simulator]
    if: ${{ !cancelled() && needs.scope.outputs.selection == 'full' }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        if: always()
        with:
          pattern: native-*
          path: artifacts/native-performance-coverage
      - name: Aggregate retained collector evidence and unscheduled platforms
        if: always()
        env:
          TN_PERF_REQUIRED_DESKTOP: ${{ needs.scope.outputs.native_tier == 'full' && inputs.ios_only != true && 'Windows,macOS' || '' }}
        run: |
          pnpm tsx scripts/performance-regression/ci-summary.ts \
            --artifact-dir artifacts/native-performance-coverage \
            --manifest scripts/performance-regression/lanes.json \
            --coverage desktop-parity,Windows,macOS,android-emulator,ios-simulator \
            --required-lanes "$TN_PERF_REQUIRED_DESKTOP" \
            --expected-sha "$TN_CI_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  networking-matrix:
    name: Networking qualification matrix
    needs: [scope, android-emulator-parity, desktop-parity, desktop, ios-simulator]
    if: ${{ always() && needs.scope.outputs.selection == 'full' }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      # The aggregator is plain Node with no dependencies, so this job needs no pnpm
      # install and no toolchain setup. Its own suite already runs in CI's test-unit
      # shards; re-running it here would only duplicate that work.
      - uses: actions/download-artifact@v7
        if: always()
        with:
          # Networking lane results only. The platform jobs upload conformance artifacts
          # as native-*, and the aggregator validates every JSON under this path, so that
          # pattern would fail the gate on foreign evidence. Task 7c publishes these.
          pattern: networking-lane-*
          path: artifacts/networking-matrix
          # No lane publishes these yet, so nothing matching is the expected state today.
          # It is not `continue-on-error`: a download that genuinely fails must not be
          # indistinguishable from an empty matrix.
          if-no-files-found: ignore
      # --report-only, and named so, because ordinary CI cannot execute the qualification
      # lanes: this step reports what evidence exists and never claims a platform. The
      # aggregator fails closed without that flag, so the verdict is still the default for
      # every other caller. One lane result is enough to enforce every required row, so a
      # partial set fails here too.
      - name: Report the networking qualification matrix (not a verdict)
        if: always()
        run: |
          mkdir -p artifacts/networking-matrix
          node scripts/verify-networking-matrix.mjs \
            --manifest docs/PRDs/networking/qualification-lanes.json \
            --results artifacts/networking-matrix --report-only 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  android-emulator-parity:
    name: Android emulator visual parity
    needs: [scope, web-reference, android-v8-source]
    # Runs on every event since 2026-09-01 (owner call): the earlier narrowing held the expensive
    # platform legs behind pushes to main and a `native` label, and the lane then spent its runs
    # being cancelled by the next push instead of reporting anything. A leg that is skipped on the
    # branch where the work happens is a leg nobody is watching.
    # Ungated on pull requests again, 2026-09-06, and only this leg — desktop-parity keeps the
    # label. The cost note that gated both still stands on its numbers:
    #
    #   desktop-parity            3173s   android-emulator-parity   1858s
    #
    # but its load-bearing clause was "both are red on main today", and that was the reason the
    # evidence did not justify the minutes. This leg was red for a reason that had nothing to do
    # with any pull request's diff: `stb` is fetched fresh from raw.githubusercontent.com on every
    # run, unauthenticated, and returned 429 (run 34078916876), so `Install Android build
    # prerequisites` exited 1 and the emulator never booted. With that fixed and the lane
    # producing a result, "advisory but reporting" is worth 31 runner-minutes; "advisory and
    # always red" was not.
    #
    # desktop-parity is left gated: it is the larger half of the 84 runner-minutes, and nothing
    # here has made it green.
    #
    # This leg is still advisory, not a required check, so it reports without blocking.
    # Restoring the label gate is the same `if` desktop-parity still carries. The prose-only
    # scope skip is unrelated and kept.
    if: >-
      needs.scope.outputs.selection == 'full' &&
      inputs.ios_only != true &&
      needs.android-v8-source.result == 'success'
    # Hosted, measured: SwiftShader renders the emulator's GPU on the CPU, and on a 4-thread tn-local
    # slot run 37082733117 spent 41 min of this job's 45 still running APKs (hosted finishes in ~30).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
      # The page size this lane qualifies, as data rather than a literal inside a script step.
      # `api-level: 35` is an ordinary 4 KB image, and PRD-221's 16 KB qualification is proved on
      # the local `threenative_ps16k` AVD (`system-images;android-36;google_apis_ps16k;x86_64`),
      # which reports 16384. Pointing this lane at that image is then a change of these two values,
      # not a change of code: raise the api-level and set this to 16384.
      TN_ANDROID_EXPECTED_PAGE_SIZE: "4096"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `packages:` is explicit because the action's default is `tools platform-tools`, and
      # Google removed the obsolete `tools` package from the SDK repository: the default
      # now fails the whole step with `Failed to find package 'tools'`.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      # The three re-downloads this lane paid for on every run. Measured on run 33675488456:
      # ~6 min of SDK/emulator installation and ~5 min of the Gradle build plus the Rust
      # cross-compile, against a 35 min job. `third_party` was already cached and hit in ~4 s;
      # these were simply never added. Keys are content-addressed where a lockfile exists and
      # pinned to the versions this workflow installs where one does not, so a version bump
      # misses rather than serving a stale toolchain.
      # This leg was the only compiling native job without it — desktop-parity, desktop and
      # starter-linux all restore the same path under the same key. Its absence is why the lane
      # re-fetched every Android dependency on every run, including stb's three single headers from
      # raw.githubusercontent.com, which returned 429 on run 34078916876 and took the whole lane
      # down before the emulator booted. On a warm cache `download-deps.mjs` finds the headers
      # already present and skips the fetch entirely, so the failure mode cannot recur; the retry
      # added alongside this covers the cold-cache run that still has to reach the network.
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: >-
            native-android-third-party-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles(
              'packages/runtime-native/scripts/download-deps.mjs',
              'packages/runtime-native/scripts/build-android-v8.mjs',
              'packages/runtime-native/scripts/package-android.mjs') }}
      # No Actions cache for the SDK packages: sdkmanager installs platform, build-tools, NDK,
      # emulator and system image in about 30 seconds here, while saving them took four minutes per
      # run and multiple GB of the shared 10 GiB budget, evicting the Gradle and Cargo caches below.
      - name: Restore the Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles(
              'packages/runtime-native/android/**/*.gradle*',
              'packages/runtime-native/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Restore the Rust cross-compile caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/runtime-native/.runtime/physics-target
          key: >-
            cargo-android-${{ runner.os }}-${{ hashFiles(
              'packages/runtime-native/native/physics/Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Restore source-keyed JS bundles; every native build and conformance assertion still runs.
      # Restore-only: a standalone dispatch runs this alongside web-reference and desktop-parity on
      # the same key, and only the first of them gets the one reservation the cache service grants
      # this key. `github.event_name == 'workflow_dispatch'` is true for all three, so gating on the
      # event decided nothing; web-reference needs only `scope`, publishes, and this job needs it,
      # so it can never restore a key this run will not save.
      - name: Build browser reference workspace imports
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: "false"
      - uses: ./.github/actions/playwright-chromium
      - name: Capture browser references from the commit-keyed artifact
        uses: actions/download-artifact@v7
        with:
          name: native-web-reference-${{ needs.scope.outputs.candidate_sha }}
          path: packages/runtime-native/artifacts/conformance/web
      - name: Verify the downloaded browser reference
        run: |
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "downloaded web reference"
      - name: Take the verified Android V8 payload from its producer
        uses: actions/download-artifact@v7
        with:
          name: android-v8-${{ needs.scope.outputs.candidate_sha }}
          path: packages/runtime-native/third_party/v8-android
      - name: Install Android build prerequisites
        run: |
          # The NDK zip is a large download, and one corrupted transfer ("Error reading Zip content
          # from a SeekableByteChannel") failed this 27-minute job before the emulator was reached.
          # Retry the download; a third failure still fails the step.
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "sdkmanager failed on attempt $attempt; retrying" >&2
            sleep 15
          done
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          # build-native-physics.mjs cross-compiles the Rust physics crate for both ABIs
          # Gradle packages. Without these targets `:app:buildNativePhysics` fails with
          # E0463 can't find crate for `core`, and every conformance row fails at phase
          # "build" before the emulator is ever reached.
          rustup target add aarch64-linux-android x86_64-linux-android
          node packages/runtime-native/scripts/download-deps.mjs --android
          # --android fetches only sdl3 glue, wgpu-android, sdl3-android and quiche-android.
          # src/webgpu/bindings.cpp includes stb_image.h unconditionally, so the NDK build
          # fails with "'stb_image.h' file not found" without these. The iOS lane already
          # fetches both explicitly (verify-ios-simulator.mjs); this mirrors it.
          node packages/runtime-native/scripts/download-deps.mjs --only stb
      # Without this the x86_64 image is emulated in software: `-accel auto` finds no writable
      # /dev/kvm and falls back silently. That is the 474-second boot this lane logged, and the
      # load behind the `adb ETIMEDOUT` that then discarded a run which had already passed 74/0.
      # native-release.yml has carried these four lines all along; the parity lane never got them.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          # `|| true` on both udev calls, because the routed `tn-local` container cannot do what
          # they do: no udev is running in it and its /sys is read-only, so `udevadm trigger`
          # fails there for a reason that has nothing to do with acceleration. The container does
          # not need them — `scripts/ci-runners.sh` passes `--device /dev/kvm` and the image's
          # entrypoint sets its mode before the job starts — and a step that fails on the way to
          # the report below costs this lane the whole emulator run.
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          # Report the mode, never assert it. `test -w /dev/kvm` as the last line of this step —
          # copied from native-release.yml, where nothing has exercised it — turned "this runner
          # has no KVM" into a failed job, which is worse than the slow boot it was meant to fix.
          # A lane that cannot get acceleration should still run and say so.
          if [ -w /dev/kvm ]; then
            echo "TN_EMULATOR_ACCEL:kvm"
          else
            echo "TN_EMULATOR_ACCEL:software"
            echo "::warning::/dev/kvm is not writable on this runner; the emulator falls back to \
          software emulation, which is the 474-second boot this step exists to avoid."
          fi
      - name: Run checksum-locked APKs on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The first run to reach this step booted in 474s and then died in the action's own
          # "Disabling animations" step with `Broken pipe (32)`, exit 224 — the emulator was still
          # settling when adb was handed the next command. These options are the ones that make a
          # hosted-runner boot cheap and repeatable: software GL rather than a GPU the runner does
          # not have, and none of the audio, camera, boot animation or snapshot work this lane
          # never reads. The boot timeout is raised past the 474s that was already observed.
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none
            -gpu swiftshader_indirect -accel auto
          emulator-boot-timeout: 900
          # One line on purpose. `android-emulator-runner` feeds `script` to the emulator shell a
          # line at a time, so a `\`-continued command loses everything after the first line: from
          # 2026-09-01 this ran `run-conformance.mjs` with no arguments at all, which defaults
          # `--target` to `all`. That is the whole of the "matrix side effect" — the runner wrote
          # web, desktop, android and ios reports under the default `artifacts/conformance`,
          # overwriting the web reference this lane had just captured and then comparing the
          # emulator against the wreckage. Keep the invocation on one line; `sh -c` keeps the
          # `||` tolerance for exit 2 (rows blocked by this machine) on that same line.
          # The logcat dump rides this same folded line on purpose. `android-emulator-runner` tears
          # the emulator down when `script` returns, so a later step has no device to read: the
          # buffer has to be captured here, before the exit test that decides this step's status.
          #
          # adb's stderr goes to its own file rather than into the log. Folded into the capture it
          # would make "device offline" indistinguishable from "the observer emitted nothing": the
          # log would be non-empty, carry no marker, and the next step would blame the observer.
          # The conformance status is recorded for the same reason — exit 2 means rows blocked by
          # this machine, and the app may never have launched, which is not an observer failure.
          # The page size is captured first, before anything can tear the device down. A lane that
          # reports an Android result without writing down the page size it ran on cannot tell a
          # 16 KB qualification from an ordinary one afterwards, and PRD-221 turns on exactly that
          # distinction. Captured on the same folded line for the same reason as the logcat dump:
          # `android-emulator-runner` destroys the emulator when `script` returns.
          script: >-
            adb shell getconf PAGE_SIZE > "$RUNNER_TEMP/android-page-size.txt" 2>
            "$RUNNER_TEMP/android-page-size.err" || echo TN_ADB_PAGE_SIZE_FAILED >>
            "$RUNNER_TEMP/android-page-size.err"; TN_PLAYTEST_ALLOW_SOFTWARE=1 node
            packages/runtime-native/conformance/run-conformance.mjs --target android
            --device emulator-5554 --reference artifacts/conformance/web
            --out artifacts/conformance/android; status=$?; echo "$status" >
            "$RUNNER_TEMP/conformance-status.txt"; adb logcat -d >
            "$RUNNER_TEMP/emulator-logcat.txt" 2> "$RUNNER_TEMP/emulator-logcat.err" || echo
            TN_ADB_LOGCAT_FAILED >> "$RUNNER_TEMP/emulator-logcat.err";
            test "$status" -eq 0 -o "$status" -eq 2
      - name: Verify the observed Android page size
        if: always()
        # Fails closed: a missing observation is a failure, not a skip, so "the emulator lane ran"
        # can never stand in for "the emulator lane ran on the pages it claims".
        run: >-
          node packages/runtime-native/scripts/check-android-page-size.mjs
          "$RUNNER_TEMP/android-page-size.txt" "$TN_ANDROID_EXPECTED_PAGE_SIZE"
      - name: Verify captured parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/android/report.json";
          // This step runs on always(), so it is reached when an earlier step failed and the
          // emulator never ran. A bare ENOENT stack buries that cause; name it instead.
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_ANDROID_REPORT_MISSING: ${reportPath} was never written, so the emulator ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          // The runner's own rule, imported rather than restated. The copy that used to
          // live here knew only `fail` and `blocked`, so a report whose Android multitouch
          // proof had failed was written down as exit 2 while the runner emits 1 — and
          // `parity:ledger`, which exists precisely to recompute this cell, then reported
          // the contradiction as a second failure stacked on top of the real one.
          const { reportExitCode } = await import(
            "./packages/runtime-native/conformance/run-conformance.mjs"
          );
          const exit = reportExitCode(report);
          const ledger = [
            "# PRD-215 Android parity ledger",
            "",
            "## Target results",
            "",
            "| Target | Command | Pass | Fail | Blocked | Exit | Outcome |",
            "| --- | --- | ---: | ---: | ---: | ---: | --- |",
            `| Android emulator | \`node packages/runtime-native/conformance/run-conformance.mjs --target android --reference artifacts/conformance/web --out artifacts/conformance/android\` | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} | captured report |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-215-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-215-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/android "android emulator"
      - name: Collect bounded Android performance evidence from the emulator build
        if: always()
        run: |
          set +e
          mkdir -p packages/runtime-native/artifacts/performance-contract/android-emulator
          apk=$(find packages/runtime-native -type f -name '*.apk' -path '*build*' -print -quit)
          if [ -n "$apk" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target android --device emulator-5554 \
              --duration 1 --cold-starts 1 --repetitions 1 --warmup 1 \
              --hosted-software \
              --prebuilt-artifact "$apk" \
              --out packages/runtime-native/artifacts/performance-contract/android-emulator
            status=$?
          else
            status=2
            echo "TN_PERF_PREBUILT_ANDROID_MISSING: no APK was produced by the existing emulator build" >&2
          fi
          set -e
          printf '{"collectorExitCode":%s,"sourceSha":"%s","provenance":"android-emulator","status":"%s"}\n' \
            "$status" "$TN_CI_SHA" "$([ "$status" -eq 0 ] && echo UNVERIFIED || echo BLOCKED)" \
            > packages/runtime-native/artifacts/performance-contract/android-emulator/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/android-emulator/collector-contract.json
      # PRD-360 structural check. This proves the observer EMITS on a real Android build and that
      # the tracked evaluator parses a real logcat — the one half of the launch measurement that
      # was previously exercised only on desktop and against a mocked adb transport.
      #
      # It deliberately does NOT judge the 8s or 250ms budgets. This lane is x86_64 SwiftShader on
      # `-accel auto`, has booted in 474s without KVM, and the evaluator's own 50% battery preflight
      # is meaningless on an emulator. A budget verdict from here would be a manufactured result, so
      # the timings are recorded UNVERIFIED and only the marker's presence and shape can fail.
      - name: Assert PRD-360 pump observer emits on Android (structural, non-timing)
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const temp = process.env.RUNNER_TEMP;
          const logPath = join(temp, "emulator-logcat.txt");
          const read = (name) => {
            try {
              return readFileSync(join(temp, name), "utf8");
            } catch (error) {
              if (error?.code === "ENOENT") return null;
              throw error;
            }
          };

          const outDir = "packages/runtime-native/artifacts/performance-contract/android-emulator";
          mkdirSync(outDir, { recursive: true });

          const record = (payload) =>
            writeFileSync(
              join(outDir, "pump-silence-structural.json"),
              `${JSON.stringify(
                { provenance: "android-emulator", sourceSha: process.env.TN_CI_SHA, ...payload },
                null,
                2,
              )}\n`,
            );

          // Reached on always(), so it runs when an earlier step failed and no emulator ever
          // booted. Name that cause rather than burying it in an ENOENT stack.
          const hostLog = read("emulator-logcat.txt");
          const conformanceStatus = read("conformance-status.txt");
          if (hostLog === null || conformanceStatus === null) {
            throw new Error(
              `TN_PUMP_ANDROID_LOGCAT_MISSING: ${logPath} was never written, so the emulator lane ` +
                "did not run. Read the first failing step in this job, not this one.",
            );
          }

          // Evidence is published whatever the verdict, and that is the point: when conformance
          // fails, the step below records BLOCKED and asserts nothing about the observer, but the
          // log it just read is the only thing that says whether the markers reached Android
          // logcat at all — still unproven. Discarding it on a red run is exactly the mistake
          // `web-reference` was making, publishing the answer only from runs that did not need it.
          //
          // What is published is the marker lines, not the buffer. `adb logcat -d` returns the
          // default set including `system`, ~1,500 lines of unrelated framework chatter per run,
          // and the open question needs three greps of it. Publishing the whole buffer widens the
          // distribution surface for no added answer. The parser still reads the full capture from
          // RUNNER_TEMP; only the artifact is narrowed.
          const markerLines = hostLog.split("\n")
            .filter((line) => line.includes("TN_PUMP_SILENCE:") || line.includes("TN_PUMP_ENDPOINT:"));
          writeFileSync(
            join(outDir, "pump-markers.log"),
            `# TN_PUMP_* lines from adb logcat -d. Device output, filtered; not the full buffer.\n${
              markerLines.join("\n")
            }\n`,
          );
          // Named for what it is: adb's own stderr on the host, not device output. Empty on a
          // healthy run; on a failed one it carries host error text under an artifact whose name
          // otherwise implies the emulator produced it.
          const adbStderr = read("emulator-logcat.err");
          if (adbStderr !== null) {
            writeFileSync(
              join(outDir, "adb-host-stderr.txt"),
              `# adb stderr on the RUNNER, not emulator output.\n${adbStderr}`,
            );
          }

          // adb's own failure is not the observer's. A dead or offline device leaves a log that is
          // present, empty of markers, and would otherwise read as "the observer emitted nothing".
          const adbErrors = (read("emulator-logcat.err") ?? "").trim();
          if (adbErrors.includes("TN_ADB_LOGCAT_FAILED") || adbErrors.length > 0) {
            record({ claim: "adb could not read the buffer", pass: false, status: "BLOCKED" });
            throw new Error(`TN_PUMP_ANDROID_ADB_FAILED: ${adbErrors.slice(0, 500)}`);
          }

          // The lane deliberately accepts conformance exit 2 — rows blocked by this machine, where
          // the app may never have launched. Absent markers then say nothing about the observer,
          // so this records BLOCKED rather than manufacturing a red against it.
          if (conformanceStatus.trim() !== "0") {
            record({
              claim: "conformance did not fully execute; observer emission not assessed",
              conformanceStatus: conformanceStatus.trim(),
              pass: false,
              status: "BLOCKED",
            });
            console.log(
              `TN_PUMP_ANDROID_BLOCKED conformance exited ${conformanceStatus.trim()}; ` +
                "the app may never have launched, so the observer is not judged here.",
            );
            process.exit(0);
          }

          // The evaluator is tracked as retained source beside its proof; import the same bytes the
          // desktop suite imports rather than restating its rules here.
          const source = "docs/verification/prd-360-startup-2026-09-05/evaluate-first-playable.mjs.txt";
          const staged = join(process.env.RUNNER_TEMP, "evaluate-first-playable.mjs");
          copyFileSync(source, staged);
          const { evaluatePumpSilence } = await import(pathToFileURL(staged).href);

          // Infinity retires the budget branch, leaving presence, JSON shape, observed:true and
          // finite non-negative stamps as the only things that can fail here.
          const result = evaluatePumpSilence({ hostLog, maxGapMs: Number.POSITIVE_INFINITY });

          record({
            claim: "observer emits and parses on Android; timings are NOT a PRD-360 verdict",
            code: result.code,
            detail: result.detail ?? null,
            pass: result.pass,
            status: "UNVERIFIED",
          });

          if (!result.pass) {
            throw new Error(
              `TN_PUMP_ANDROID_STRUCTURAL_FAILED: ${result.code} ` +
                `${JSON.stringify(result.detail ?? null)}`,
            );
          }
          console.log(`TN_PUMP_ANDROID_STRUCTURAL_OK ${JSON.stringify(result.detail)}`);
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-android-emulator-parity
          path: |
            packages/runtime-native/artifacts/conformance/
            packages/runtime-native/artifacts/android/multitouch/
            packages/runtime-native/artifacts/performance-contract/
          if-no-files-found: error

      - name: Bind the exact supported native build to this attempt
        if: always()
        shell: bash
        env:
          TN_CI_NATIVE_REUSABLE: ${{ inputs.selection_plan != '' }}
          TN_CI_PLAN: ${{ needs.scope.outputs.plan }}
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || (github.event_name == 'push' && github.ref_name) || '' }}
          TN_CI_CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TN_CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TN_CI_JOB_RESULT: ${{ job.status }}
          TN_CI_NATIVE_PLATFORM: ""
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-native-receipts.mjs --write
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}-android-emulator-parity-single
          path: artifacts/ci-native-receipts/*.json
          if-no-files-found: error
          retention-days: 2
      - name: Preserve Android packaging provenance diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-android-build-provenance
          path: artifacts/ci-native-diagnostics/android-build-provenance-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 2

  release-reports:
    name: Gate-schema release evidence reports
    # PRD-059 Phase 4 emitted these from inside android-emulator-parity, which holds the android
    # and web conformance reports but never the desktop one - that is produced by desktop-parity,
    # a sibling job. generate-release-reports.mjs therefore exited non-zero on every run and the
    # step swallowed it as TN_RELEASE_REPORTS_DEFERRED, so both uploads found no file and warned.
    # Run 34618061045 succeeded on 2026-09-11 carrying neither artifact, and the release candidate
    # gate requires both. Reports need all three subjects, so they get a job that has all three.
    needs: [scope, android-emulator-parity, desktop-parity]
    if: >-
      needs.scope.outputs.selection != 'prose' &&
      inputs.ios_only == false
    # Report assembly only - artifact download, `pnpm install` and JSON reports, no compile or GPU
    # leg (unlike desktop-parity:906) - so it joins the light lane instead of queuing behind builds.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 20
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate directories on purpose: both artifacts carry a conformance/web tree, and landing
      # them on top of each other would make which copy the reports describe depend on ordering.
      - uses: actions/download-artifact@v7
        with:
          name: native-android-emulator-parity
          path: evidence/android
      - uses: actions/download-artifact@v7
        with:
          name: native-desktop-parity
          path: evidence/desktop
      - name: Emit gate-schema parity and provenance evidence reports
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TN_CI_SHA" || {
            echo "TN_RELEASE_REPORT_CANDIDATE_MISMATCH: report checkout differs from captured candidate" >&2
            exit 1
          }
          node packages/runtime-native/scripts/generate-native-sbom.mjs --out "$RUNNER_TEMP/sbom-evidence"
          mkdir -p reports
          node packages/runtime-native/scripts/generate-release-reports.mjs \
            --candidate "$TN_CI_SHA" \
            --registry-sha256 "$(sha256sum packages/runtime-native/conformance/registry.json | cut -d' ' -f1)" \
            --android evidence/android/conformance/android/report.json \
            --desktop evidence/desktop/conformance/desktop/report.json \
            --web evidence/desktop/conformance/web/report.json \
            --lock packages/runtime-native/native-deps.lock.json \
            --sbom "$RUNNER_TEMP/sbom-evidence/native-dependencies.cdx.json" \
            --inventory "$RUNNER_TEMP/sbom-evidence/native-license-inventory.json" \
            --pnpm-lock-sha "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" \
            --cargo-lock-sha "$(sha256sum packages/runtime-native/native/physics/Cargo.lock | cut -d' ' -f1)" \
            --out reports
          test -s reports/parity.json
          test -s reports/provenance.json
      # `error`, not `warn`. A warn here is what let a green run ship with no reports at all.
      # The leading wildcard is load-bearing: upload-artifact strips everything before the first
      # wildcard, and a bare `reports/parity.json` flattened to `parity.json`, which the candidate
      # gate resolves as `reports/parity.json` and then refuses. `*/parity.json` matches `reports`
      # and keeps `reports/parity.json` inside the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-parity
          path: "*/parity.json"
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-provenance
          path: "*/provenance.json"
          if-no-files-found: error

  desktop-parity:
    name: Desktop web/native parity
    needs: [scope, web-reference]
    # Full selection means full native coverage, including promotion PRs. Previously a label
    # could suppress this leg independently of the caller's decision. Inert develop changes now
    # avoid the whole native family instead of paying for a partial native qualification.
    if: >-
      needs.scope.outputs.selection == 'full' &&
      inputs.ios_only != true
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 75
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # The lane name is part of the namespace on purpose: this job, native `starter-linux`
          # and ci `test` compile different target sets, and while all three saved under
          # `native-ccache-<os>-<arch>-gcc-` each restored whichever sibling finished last and
          # recompiled its own objects against it. See the note in ci.yml's `test` job.
          key: native-ccache-desktop-parity-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-desktop-parity-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # Restore source-keyed JS bundles; every native build and conformance assertion still runs.
      # Restore-only, and it needs web-reference: on a standalone dispatch that job takes the one
      # reservation this key allows instead of racing for it. `inputs.ios_only` does not create a
      # second saver either — it skips this job and web-reference together, and no `ios_only`-only
      # job restores these bundles at all.
      - name: Build browser reference workspace imports
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: "false"
      - uses: ./.github/actions/playwright-chromium
      - name: Capture browser references from the commit-keyed artifact
        uses: actions/download-artifact@v7
        with:
          name: native-web-reference-${{ needs.scope.outputs.candidate_sha }}
          path: packages/runtime-native/artifacts/conformance/web
      - name: Verify the downloaded browser reference
        run: |
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/web "downloaded web reference"
      - name: Install Linux desktop build dependencies and ccache
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
      - name: Zero the compiler cache counters
        shell: bash
        run: ccache --zero-stats
      - name: Build the native host
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Report the compiler cache hit rate
        if: always() && env.CCACHE_UNAVAILABLE != '1'
        shell: bash
        run: ccache --show-stats
      - name: Compare the desktop host with browser references
        # Same hosted-software declaration as the ui-frame gate below: this runner binds Mesa
        # llvmpipe, so the desktop host reports a software adapter it cannot avoid.
        env:
          TN_PLAYTEST_ALLOW_SOFTWARE: "1"
        run: |
          set +e
          sh scripts/xvfb.sh \
            node packages/runtime-native/conformance/run-conformance.mjs \
            --target desktop --reference artifacts/conformance/web --out artifacts/conformance/desktop
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Verify captured desktop parity ledger
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const reportPath = "packages/runtime-native/artifacts/conformance/desktop/report.json";
          const report = await readFile(reportPath, "utf8").then(JSON.parse, (error) => {
            if (error?.code !== "ENOENT") throw error;
            throw new Error(
              `TN_PARITY_DESKTOP_REPORT_MISSING: ${reportPath} was never written, so the desktop ` +
                "lane did not run. Read the first failing step in this job, not this one.",
            );
          });
          const summary = report.summary;
          for (const key of ["pass", "fail", "blocked"]) {
            if (!Number.isInteger(summary?.[key])) throw new Error(`Missing integer summary.${key}`);
          }
          // The runner's own rule, imported rather than restated. The copy that used to
          // live here knew only `fail` and `blocked`, so a report whose Android multitouch
          // proof had failed was written down as exit 2 while the runner emits 1 — and
          // `parity:ledger`, which exists precisely to recompute this cell, then reported
          // the contradiction as a second failure stacked on top of the real one.
          const { reportExitCode } = await import(
            "./packages/runtime-native/conformance/run-conformance.mjs"
          );
          const exit = reportExitCode(report);
          const ledger = [
            "# PRD-303 desktop parity ledger",
            "",
            "## Target results",
            "",
            "| Target | Command | Pass | Fail | Blocked | Exit | Outcome |",
            "| --- | --- | ---: | ---: | ---: | ---: | --- |",
            `| Desktop | \`node packages/runtime-native/conformance/run-conformance.mjs --target desktop --reference artifacts/conformance/web --out artifacts/conformance/desktop\` | ${summary.pass} | ${summary.fail} | ${summary.blocked} | ${exit} | captured report |`,
            "",
          ].join("\n");
          await writeFile(`${process.env.RUNNER_TEMP}/prd-303-desktop-parity-ledger.md`, ledger);
          NODE
          pnpm parity:ledger "$RUNNER_TEMP/prd-303-desktop-parity-ledger.md"
          node packages/runtime-native/conformance/check-lane-blocks.mjs \
            packages/runtime-native/artifacts/conformance/desktop "desktop parity"
      # The one platform whose UI path differs: on Linux the page is a texture inside the game's
      # own frame, so this gate asserts the composite's counter and size, the page's own colour in
      # the captured frame, and the routing table, all from one run. Windows and macOS run the same
      # verifier through `native:verify:desktop` in the `desktop` matrix job below — exactly how the
      # loading gate is wired — and there it asserts the child-web-view half and names the two
      # frame assertions it cannot make (platform::uiOverlayFrame reports no page frame off Linux).
      # Android and iOS attach their own web views from their own hosts (Java/Swift) and keep their
      # own lanes; nothing in this gate applies to them.
      - name: Verify the web UI composites into the game's own frame
        # The Linux runner has no GPU; its Vulkan ICD is Mesa lavapipe, the llvmpipe software
        # rasteriser. Declared at this caller rather than assumed for every native target.
        env:
          TN_PLAYTEST_ALLOW_SOFTWARE: "1"
        run: pnpm --filter @threenative/runtime-native native:verify:ui-frame
      - name: Collect bounded desktop performance evidence from the existing binary
        if: always()
        run: |
          set +e
          mkdir -p packages/runtime-native/artifacts/performance-contract/desktop-parity
          binary="$GITHUB_WORKSPACE/packages/runtime-native/build/tn-linux/mystral"
          if [ -x "$binary" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target desktop --duration 1 --cold-starts 1 \
              --repetitions 1 --warmup 1 --hosted-software --prebuilt-artifact "$binary" \
              --out packages/runtime-native/artifacts/performance-contract/desktop-parity
            status=$?
          else
            status=2
            echo "TN_PERF_PREBUILT_DESKTOP_MISSING: $binary" >&2
          fi
          set -e
          printf '{"collectorExitCode":%s,"sourceSha":"%s","status":"%s"}\n' \
            "$status" "$TN_CI_SHA" "$([ "$status" -eq 0 ] && echo PASS || echo BLOCKED)" \
            > packages/runtime-native/artifacts/performance-contract/desktop-parity/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/desktop-parity/collector-contract.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-parity
          path: |
            packages/runtime-native/artifacts/conformance/
            packages/runtime-native/artifacts/performance-contract/
          if-no-files-found: error

      - name: Bind the exact supported native build to this attempt
        if: always()
        shell: bash
        env:
          TN_CI_NATIVE_REUSABLE: ${{ inputs.selection_plan != '' }}
          TN_CI_PLAN: ${{ needs.scope.outputs.plan }}
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || (github.event_name == 'push' && github.ref_name) || '' }}
          TN_CI_CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TN_CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TN_CI_JOB_RESULT: ${{ job.status }}
          TN_CI_NATIVE_PLATFORM: ""
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-native-receipts.mjs --write
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}-desktop-parity-single
          path: artifacts/ci-native-receipts/*.json
          if-no-files-found: error
          retention-days: 2

  desktop:
    name: ${{ matrix.platform }} desktop core
    needs: scope
    # Runs on every event since 2026-09-01 (owner call) — see android-emulator-parity. The only
    # remaining gates are the manual `ios_only` dispatch toggle, which exists to run the iOS lane
    # alone, and the tier: macOS and Windows are not Linux rows, so an ordinary pull request's
    # reduced matrix (PRD-380 phase 2) skips them rather than holding two hosted runners per push.
    # No label exempts them, and main, the nightly and an audit keep the full tier.
    if: needs.scope.outputs.selection == 'full' && inputs.ios_only != true && needs.scope.outputs.native_tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
          - platform: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Build native-smoke workspace dependencies
        shell: bash
        run: |
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < <(pnpm tsx scripts/workspace-packages.ts --archives)
      - run: pnpm --filter threenative-native-smoke build
      # ccache makes this build faster; it never makes it correct. So a package feed that is slow
      # or down must not turn a compiler cache into a failed platform leg — which is exactly what
      # happened on 2026-09-10, when `choco install ccache` timed out after 100 s against
      # community.chocolatey.org and took `build` and `golden-path`, both required checks, down
      # with it on a pull request that changed one test file.
      #
      # Prefer an existing cache, then retry the install. If it still will not install, drop the
      # compiler launcher and build without it: slower, byte-identical output, and the compile and
      # test assertions below are untouched. `CCACHE_UNAVAILABLE` is the honest record of that,
      # printed in the step summary rather than swallowed.
      - name: Install ccache on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Reuse a working runner-provided cache before contacting the package feed.
          ccache --version 2>/dev/null && exit 0
          for attempt in 1 2 3; do
            brew install ccache && ccache --version && exit 0
            echo "brew install ccache failed (attempt $attempt)"
            sleep $((attempt * 15))
          done
          echo "CCACHE_UNAVAILABLE=1" >> "$GITHUB_ENV"
          echo "::warning::ccache unavailable after 3 attempts; building without the compiler cache"
      - name: Install ccache on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Reuse a working runner-provided cache before contacting the package feed.
          ccache --version 2>/dev/null && exit 0
          for attempt in 1 2 3; do
            choco install ccache --yes --no-progress && ccache --version && exit 0
            echo "choco install ccache failed (attempt $attempt)"
            sleep $((attempt * 15))
          done
          echo "CCACHE_UNAVAILABLE=1" >> "$GITHUB_ENV"
          echo "::warning::ccache unavailable after 3 attempts; building without the compiler cache"
      - name: Drop the compiler launcher when ccache is unavailable
        if: env.CCACHE_UNAVAILABLE == '1'
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
      - name: Zero the compiler cache counters
        if: env.CCACHE_UNAVAILABLE != '1'
        shell: bash
        run: ccache --zero-stats
      - name: Install Windows HTTP build dependencies
        if: runner.os == 'Windows'
        run: >-
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          "curl:x64-windows-static" "zlib:x64-windows-static"
      - name: Build native runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          where cl
          pnpm --filter @threenative/runtime-native native:build
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Report the compiler cache hit rate
        if: always() && env.CCACHE_UNAVAILABLE != '1'
        shell: bash
        run: ccache --show-stats
      # `VsDevCmd.bat` configures the process it runs in, and a `cmd` step's environment dies with
      # the step. So this ran without INCLUDE, LIB or a usable `cl`, and the first thing inside it
      # that *configures* a build directory — the physics contract lane — got "the C compiler is
      # not able to compile a simple test program". The runtime itself had already built fine one
      # step earlier, which is why it looked like a code failure rather than a missing environment.
      #
      # Enter the developer environment here too, rather than exporting it through GITHUB_ENV: that
      # would put a Windows-style PATH in front of every later step, including the bash ones.
      - name: Verify the desktop runtime with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set "CC=cl"
          set "CXX=cl"
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          rem This runner has no GPU and its adapter reports `Microsoft Basic Render Driver`.
          rem The acceptance is declared here, in the lane that has none, and stays off macOS.
          set "TN_PLAYTEST_ALLOW_SOFTWARE=1"
          pnpm --filter @threenative/runtime-native native:verify:desktop
      - if: runner.os != 'Windows'
        run: pnpm --filter @threenative/runtime-native native:verify:desktop
      # PRD-217 phases 1/2: the default starter's WebView HUD, on the Windows and macOS hosts it
      # is claimed for. The internal proof route admits the web UI before the public guard opens;
      # `verify-starter-desktop.mjs` then asserts the overlay attached, because DWM and Quartz
      # always composite. `test:native` builds the starter's real src/ui, not a fixture.
      - name: Pack the workspace packages for the starter lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/threenative-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold the starter from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/threenative-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-starter-native
          template: starter
      - name: Build and verify the starter's WebView HUD
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-starter-native"
          runtime="$PWD/packages/runtime-native/build/tn-macos/mystral"
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            runtime="$PWD/packages/runtime-native/build/tn-windows/mystral.exe"
            # A hosted Windows runner has no GPU and answers `Microsoft Basic Render Driver`.
            # Only Windows declares it; the macOS leg of this same matrix runs against whatever
            # the machine actually has and keeps the default fail-closed software-adapter error.
            export TN_PLAYTEST_ALLOW_SOFTWARE=1
          fi
          pnpm --dir "$target" install --ignore-scripts
          THREENATIVE_RUNTIME_BINARY="$runtime" pnpm --dir "$target" test:native
          # The required test itself: press the HUD's pause island (game state flips) and move
          # through empty UI space, driven through the overlay's published hit regions.
          node packages/runtime-native/scripts/verify-starter-ui-overlay.mjs \
            --project "$target" \
            --runtime "$runtime" \
            --skip-build \
            --artifacts packages/runtime-native/artifacts/starter-ui-${{ matrix.platform }}
      - name: Upload the starter HUD evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-starter-${{ matrix.platform }}
          path: ${{ runner.temp }}/threenative-starter-native/artifacts/native/
          if-no-files-found: warn
      - name: Upload the starter HUD input evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-starter-ui-${{ matrix.platform }}
          path: packages/runtime-native/artifacts/starter-ui-${{ matrix.platform }}/
          if-no-files-found: warn
      # PRD-365 acceptance criterion 1: the release path (`--mode release` -> packageDesktopContainer)
      # was fixture-tested only. These steps build the real container on the hosted OS, relocate it
      # outside the project and launch it with the installed verifier, so the debug `test:native`
      # above stays exactly as it was.
      # PRD-375: the scaffold copies the engine's own art to `public/icon.png`, so a stock container
      # carries the engine icon by construction and the brand inspector correctly refuses it. Author
      # real art here, the way a developer does, so the release container below carries a game brand
      # there is something to verify. Only this file changes: identity strings stay as scaffolded,
      # so every existing assertion in this job reads exactly what it read before.
      - name: Give the scaffolded starter its own authored icon
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = "Windows" ]; then root=$(cygpath -u "$RUNNER_TEMP"); fi
          cp .github/fixtures/prd-375-brand-icon.png "$root/threenative-starter-native/public/icon.png"
      - name: Install and verify the desktop release packaging tools
        shell: bash
        run: |
          set -euo pipefail
          # The release container is a ZIP on macOS and Windows and desktop-distribution.mjs shells
          # out to `zip -r -q`. A missing archiver must be a red job, never a silent pass.
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            # The community feed drops requests now and then ("package was not found" for a listed
            # version, run 37079046851). Retry twice; makensis -VERSION below still fails closed.
            for attempt in 1 2 3; do
              choco install zip -y --no-progress && choco install nsis --version=3.11.0 -y --no-progress && break
              [ "$attempt" = 3 ] || sleep 30
            done
            nsis='/c/Program Files (x86)/NSIS'
            "$nsis/makensis.exe" -VERSION
            cygpath -w "$nsis" >> "$GITHUB_PATH"
            # The starter sets app.icon, so desktop-distribution.mjs shells out to rcedit to embed
            # the icon and version strings in the PE resources. rcedit is not on the runner image.
            # Pin the release: `latest` would make the packaged identity move under us.
            tools="$RUNNER_TEMP/tn-packaging-tools"
            mkdir -p "$tools"
            curl -fsSL -o "$tools/rcedit.exe" \
              https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
            sha256sum "$tools/rcedit.exe"
            # GITHUB_PATH is consumed by later steps in their own shell. The release build below is
            # a `cmd` step, so this has to be the Windows form, not the git-bash POSIX one.
            cygpath -w "$tools" >> "$GITHUB_PATH"
            PATH="$tools:$PATH" rcedit.exe --help >/dev/null 2>&1 || {
              echo "TN_DESKTOP_RESOURCE_TOOL_MISSING: downloaded rcedit.exe does not run." >&2
              exit 1
            }
          else
            # sips and iconutil convert the authored icon into the .icns the .app carries. Both ship
            # with macOS, so assert them rather than installing anything.
            for tool in sips iconutil; do
              command -v "$tool" >/dev/null 2>&1 || {
                echo "TN_DESKTOP_RESOURCE_TOOL_MISSING: '$tool' is required to build the macOS app icon." >&2
                exit 1
              }
            done
          fi
          if ! zip -v >/dev/null 2>&1; then
            echo "TN_DESKTOP_ARCHIVER_MISSING: 'zip' is required to write the desktop release container." >&2
            exit 1
          fi
      - name: Exercise the compiled Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TN_WINDOWS_INSTALLER_INTEGRATION=1 pnpm --dir packages/runtime-native exec vitest run --config vitest.config.ts tests/windows-installer.test.mjs
      # A disposable trusted certificate proves the actual signing tools and final installer.
      # These are CI qualification artifacts, not proof of public Authenticode trust.
      - name: Create a self-signed code-signing certificate for the proof
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $subject = 'ThreeNative CI Signing Proof'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$subject" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          # `signtool verify /pa` requires a trusted chain, so the self-signed root is trusted for
          # this user only, on this throwaway runner.
          $cer = Join-Path $env:RUNNER_TEMP 'tn-signing-proof.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          # CurrentUser\Root opens an interactive Root Certificate Store confirmation on hosted Windows.
          # Use certutil against the machine Root store instead: the hosted runner is disposable and
          # elevated, and -f makes the trust operation non-interactive while keeping /pa verification real.
          & certutil.exe -f -addstore Root $cer | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "TN_DESKTOP_SIGNING_PROOF: certutil failed to trust the CI certificate" }
          # signtool ships with the Windows SDK and is on PATH only inside a Developer Command
          # Prompt, the same way dumpbin is. The signing step runs in bash, so put the newest x64
          # SDK signtool on PATH for the steps that follow rather than entering VsDevCmd there.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'TN_DESKTOP_SIGNING_PROOF: no signtool.exe found in the Windows SDK' }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.DirectoryName
          Write-Host "created $($cert.Thumbprint) for CN=$subject; signtool at $($signtool.FullName)"
      # PRD-365 phase 3, macOS half of the owner's 2026-09-23 decision: prove that
      # `threenative build --mode release` signs with a developer credential, using a certificate
      # generated on the runner. The Windows leg already does this with `signtool /n`; this mirrors
      # it for `codesign`. The certificate is self-signed and discarded, so this proves the adapter,
      # `codesign` and the host, not Developer ID trust or notarization — those stay PENDING.
      - name: Create a self-signed code-signing certificate for the macOS proof
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/tn-signing-proof.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # A certificate is only a codesigning identity when it carries the codeSigning extended
          # key usage; without it `security find-identity -p codesigning` never lists it and
          # `codesign` reports "no identity found". A config file rather than `-addext` because
          # macOS ships LibreSSL, whose `req` support differs from OpenSSL's.
          cat > "$RUNNER_TEMP/tn-signing-proof.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = codesign
          prompt = no
          [dn]
          CN = ThreeNative CI Signing Proof
          [codesign]
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          basicConstraints = critical, CA:FALSE
          EOF
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$RUNNER_TEMP/tn-signing-proof-key.pem" \
            -out "$RUNNER_TEMP/tn-signing-proof-cert.pem" \
            -config "$RUNNER_TEMP/tn-signing-proof.cnf"
          # LibreSSL and OpenSSL 3 disagree on the PKCS#12 default cipher, and a failed import here
          # would read later as "no identity found". OpenSSL 3's modern default (AES-256-CBC with
          # a SHA-256 MAC) exports fine but macOS refuses it with "SecKeychainItemImport: MAC
          # verification failed during PKCS12 import" — so lead with the legacy algorithms macOS
          # accepts, and fall back to the modern default only where -legacy is unavailable (LibreSSL,
          # whose default is already importable).
          # macOS `security import` fails the MAC check on an empty-password PKCS#12, so use a throwaway one.
          p12_password="$(openssl rand -hex 16)"
          p12="$RUNNER_TEMP/tn-signing-proof.p12"
          if ! openssl pkcs12 -export -legacy -out "$p12" -inkey "$RUNNER_TEMP/tn-signing-proof-key.pem" \
              -in "$RUNNER_TEMP/tn-signing-proof-cert.pem" -passout "pass:$p12_password" 2>/dev/null; then
            openssl pkcs12 -export -out "$p12" -inkey "$RUNNER_TEMP/tn-signing-proof-key.pem" \
              -in "$RUNNER_TEMP/tn-signing-proof-cert.pem" -passout "pass:$p12_password"
          fi
          security import "$p12" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign
          # Without the partition list `codesign` blocks on a keychain-access prompt a hosted runner
          # cannot answer, which reads as a signing failure.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A throwaway self-signed certificate is never trusted, so `find-identity -v` (valid only)
          # lists nothing; codesign still signs with an untrusted identity named by its SHA-1 hash.
          security find-identity -p codesigning "$keychain" | tee "$RUNNER_TEMP/tn-signing-identity.txt"
          identity_hash="$(grep 'ThreeNative CI Signing Proof' "$RUNNER_TEMP/tn-signing-identity.txt" | head -1 | awk '{print $2}')"
          if [ -z "$identity_hash" ]; then
            echo "TN_DESKTOP_SIGNING_PROOF: the generated certificate is not a usable codesigning identity." >&2
            exit 1
          fi
          echo "TN_SIGNING_PROOF_IDENTITY=$identity_hash" >> "$GITHUB_ENV"
      # The container records every DLL the executable imports so it can be relocated, and
      # `desktop-distribution.mjs` reads them with `dumpbin`, which lives only inside the Visual
      # Studio developer environment. Enter it here rather than exporting it through GITHUB_ENV,
      # for the same reason the native build and verify steps above do.
      - name: Build the desktop release container with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          where dumpbin || exit /b 1
          where rcedit || exit /b 1
          set "THREENATIVE_RUNTIME_BINARY=%GITHUB_WORKSPACE%\packages\runtime-native\build\tn-windows\mystral.exe"
          set "THREENATIVE_DESKTOP_SIGN_SUBJECT=ThreeNative CI Signing Proof"
          pnpm --dir "%RUNNER_TEMP%\threenative-starter-native" exec threenative build --target desktop --mode release
      - name: Build the desktop release container
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/runtime-native exec vitest run --config vitest.config.ts tests/desktop-finalization.test.mjs
          target="$RUNNER_TEMP/threenative-starter-native"
          # The test credential created above, exactly as the Windows leg passes its own subject:
          # this proves the release build signs with a developer identity rather than ad-hoc, while
          # Developer ID trust, notarization and Gatekeeper acceptance stay PENDING.
          THREENATIVE_DESKTOP_CODESIGN_IDENTITY="$TN_SIGNING_PROOF_IDENTITY" \
          THREENATIVE_RUNTIME_BINARY="$PWD/packages/runtime-native/build/tn-macos/mystral" \
            pnpm --dir "$target" exec threenative build --target desktop --mode release
      - name: Relocate and extract the release container outside the project
        shell: bash
        run: |
          set -euo pipefail
          # git-bash ships GNU tar, which reads `D:\a\_temp\...` as a remote host:path spec and
          # fails with "Cannot connect to D". Work in POSIX paths on Windows so no argument carries
          # a drive-letter colon; every later step takes these same normalised values.
          root="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = "Windows" ]; then root=$(cygpath -u "$RUNNER_TEMP"); fi
          target="$root/threenative-starter-native"
          # The space in the destination is the point: the unpacked container must launch wherever a
          # player put it, so it is relocated out of the build tree before it is verified.
          dest="$root/tn relocated/unpacked"
          rm -rf "$root/tn relocated"
          mkdir -p "$dest"
          # dist-native also holds the debug build's raw executable and ui/, so match the release
          # archive by extension instead of a project name that varies per scaffold.
          archive=$(find "$target/dist-native" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          archive_count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            archive_count=$((archive_count + 1))
          done <<< "$archive"
          if [ "$archive_count" -ne 1 ]; then
            echo "TN_DESKTOP_RELEASE_ARCHIVE_COUNT: expected exactly one release archive under $target/dist-native, found: $archive" >&2
            exit 1
          fi
          # The container is a ZIP on both, and only bsdtar reads ZIP. macOS's `tar` is bsdtar, but
          # on Windows git-bash's GNU tar shadows the system one, so name System32's explicitly
          # rather than extracting with whichever `tar` happens to win the PATH.
          archiver=tar
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            archiver=/c/Windows/System32/tar.exe
            [ -x "$archiver" ] || {
              echo "TN_DESKTOP_ARCHIVE_TOOL_MISSING: $archiver is required to read the ZIP container." >&2
              exit 1
            }
          fi
          "$archiver" -xf "$archive" -C "$dest"
          # Locate the container root by its manifest; this also ignores a stray __MACOSX entry an
          # archiver may add, which a bare "one top-level directory" check would mistake for a root.
          manifest=$(find "$dest" -name threenative-container.json -type f -print)
          manifest_count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            manifest_count=$((manifest_count + 1))
          done <<< "$manifest"
          if [ "$manifest_count" -ne 1 ]; then
            echo "TN_DESKTOP_CONTAINER_MANIFEST_COUNT: expected exactly one threenative-container.json under $dest, found: $manifest" >&2
            exit 1
          fi
          case "$manifest" in
            */Contents/Resources/threenative-container.json) container=${manifest%/Contents/Resources/threenative-container.json} ;;
            */threenative-container.json) container=${manifest%/threenative-container.json} ;;
            *) echo "TN_DESKTOP_CONTAINER_MANIFEST_LAYOUT: unrecognised manifest path $manifest" >&2; exit 1 ;;
          esac
          echo "TN_RELEASE_CONTAINER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "TN_RELEASE_CONTAINER_ROOT=$container" >> "$GITHUB_ENV"
      - name: Record the release container identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="packages/runtime-native/artifacts/release-container-${{ matrix.platform }}"
          mkdir -p "$evidence"
          # git-bash carries sha256sum, macOS only shasum; do not assume either.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$TN_RELEASE_CONTAINER_ARCHIVE" | tee "$evidence/archive.sha256"
          else
            sha256sum "$TN_RELEASE_CONTAINER_ARCHIVE" | tee "$evidence/archive.sha256"
          fi
          manifest=$(find "$TN_RELEASE_CONTAINER_ROOT" -name threenative-container.json -type f -print)
          cp "$manifest" "$evidence/container-manifest.json"
      - name: Assert the container carries the game's OS identity
        shell: bash
        run: |
          set -euo pipefail
          # rcedit / Info.plist exiting 0 is not the same as the identity being in the artifact.
          # PRD-365 claims the identity, so read it back out of the relocated container.
          container="$TN_RELEASE_CONTAINER_ROOT"
          manifest=$(find "$container" -name threenative-container.json -type f -print)
          # node, not python3: git-bash on the Windows runner has no `python3` on PATH, and node is
          # already guaranteed by the setup-node step above.
          read_app() { node -e "const m=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(m.app[process.argv[2]]??''))" "$1" "$2"; }
          name=$(read_app "$manifest" name)
          icon=$(read_app "$manifest" icon)
          [ -n "$name" ] || { echo "TN_DESKTOP_IDENTITY_NAME_MISSING: manifest records no app name." >&2; exit 1; }
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            executable=$(find "$container" -maxdepth 1 -name '*.exe' -type f -print)
            info=$(powershell -NoProfile -Command "(Get-Item '$(cygpath -w "$executable")').VersionInfo | Format-List" )
            printf '%s\n' "$info"
            printf '%s\n' "$info" | grep -q "ProductName *: *$name" || {
              echo "TN_DESKTOP_IDENTITY_PRODUCTNAME: PE ProductName is not '$name'." >&2; exit 1; }
            printf '%s\n' "$info" | grep -q "FileDescription *: *$name" || {
              echo "TN_DESKTOP_IDENTITY_FILEDESCRIPTION: PE FileDescription is not '$name'." >&2; exit 1; }
            printf '%s\n' "$info" | grep -qE "FileVersion *: *[0-9]" || {
              echo "TN_DESKTOP_IDENTITY_FILEVERSION: PE FileVersion is empty." >&2; exit 1; }
          else
            plist="$container/Contents/Info.plist"
            [ -f "$plist" ] || { echo "TN_DESKTOP_IDENTITY_PLIST_MISSING: no Contents/Info.plist at $plist." >&2; exit 1; }
            plutil -p "$plist"
            plutil -p "$plist" | grep -q "\"CFBundleName\" => \"$name\"" || {
              echo "TN_DESKTOP_IDENTITY_BUNDLENAME: CFBundleName is not '$name'." >&2; exit 1; }
            icns=$(plutil -extract CFBundleIconFile raw "$plist")
            [ -n "$icns" ] || { echo "TN_DESKTOP_IDENTITY_ICONFILE: CFBundleIconFile is empty." >&2; exit 1; }
            case "$icns" in *.icns) ;; *) icns="$icns.icns" ;; esac
            [ -f "$container/Contents/Resources/$icns" ] || {
              echo "TN_DESKTOP_IDENTITY_ICNS_MISSING: Contents/Resources/$icns is absent." >&2; exit 1; }
          fi
          # The icon the manifest records must be in the container on every platform.
          if [ -n "$icon" ]; then
            [ -f "$container/$icon" ] || {
              echo "TN_DESKTOP_IDENTITY_ICON_MISSING: recorded icon $icon is absent from the container." >&2; exit 1; }
          fi
      # PRD-365 phase 3, macOS half: read the release build's signature back independently of the
      # code that wrote it. The manifest records the scheme; `codesign` confirms the seal and
      # `codesign -dv` names the test signer. This is what turns "the build passed a credential"
      # into "the artifact a player downloads is signed by it".
      - name: Read the macOS signature back off the release container
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          container="$TN_RELEASE_CONTAINER_ROOT"
          manifest=$(find "$container" -name threenative-container.json -type f -print)
          signed=$(node -e "const m=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(m.signed)+' '+String(m.signingScheme))" "$manifest")
          printf '%s\n' "manifest signed/scheme: $signed"
          case "$signed" in
            "true codesign") ;;
            *) echo "TN_DESKTOP_SIGNING_PROOF: release manifest records '$signed', not 'true codesign'." >&2; exit 1 ;;
          esac
          codesign --verify --strict --deep "$container"
          details=$(codesign -dv --verbose=4 "$container" 2>&1)
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -q 'Authority=ThreeNative CI Signing Proof' || {
            echo "TN_DESKTOP_SIGNING_PROOF: the release container is not signed by the CI proof identity." >&2
            exit 1
          }
          echo "TN_DESKTOP_SIGNING_PROOF_SCHEME:codesign"
      # PRD-375: the shipped brand inspector, against the exact packaged artifact. It reads the
      # .exe's own RT_GROUP_ICON/RT_ICON and RT_VERSION/VS_FIXEDFILEINFO on Windows and the
      # .icns/Info.plist linkage on macOS, comparing them with the consumer config the build
      # resolved. This inspection is independent of the following launch proof and runs on
      # Windows too, where a real rcedit-written PE resource section exists.
      - name: Inspect the release container's game brand
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = "Windows" ]; then root=$(cygpath -u "$RUNNER_TEMP"); fi
          target="$root/threenative-starter-native"
          container="$TN_RELEASE_CONTAINER_ROOT"
          config="$target/.threenative/build/config.json"
          # node here is win32 node, which reads `/d/a/_temp/...` as a relative path and resolves it
          # against the drive root. Convert the inspector inputs explicitly.
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            container=$(cygpath -w "$container")
            config=$(cygpath -w "$config")
            target=$(cygpath -w "$target")
          fi
          evidence="packages/runtime-native/artifacts/release-container-${{ matrix.platform }}"
          mkdir -p "$evidence"
          node packages/runtime-native/scripts/verify-starter-desktop.mjs \
            --brand-only \
            --container "$container" \
            --config "$config" \
            --project "$target" | tee "$evidence/brand.txt"
      # Re-enabled on Windows: the game now travels beside the executable as `game.bundle`, so
      # rcedit rewriting the PE no longer discards it and the container launches the real game.
      - name: Verify the relocated release container with the installed verifier
        shell: bash
        run: |
          set -euo pipefail
          # Same POSIX normalisation as the relocate step, so the verifier sees one path style.
          root="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = "Windows" ]; then root=$(cygpath -u "$RUNNER_TEMP"); fi
          target="$root/threenative-starter-native"
          cd "$target"
          # The installed verifier, not the engine checkout: it is the copy a player gets.
          node "$target/node_modules/@threenative/runtime-native/scripts/verify-starter-desktop.mjs" \
            --container "$TN_RELEASE_CONTAINER_ROOT" \
            --project "$target"
      - name: Play the relocated macOS release with React controls
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const project = join(process.env.RUNNER_TEMP, 'threenative-starter-native');
          const { resolveContainer } = await import(pathToFileURL(join(project,
            'node_modules/@threenative/runtime-native/scripts/desktop-distribution.mjs')));
          const container = process.env.TN_RELEASE_CONTAINER_ROOT;
          const executable = join(container, resolveContainer(container).executable);
          const result = spawnSync(process.execPath, [
            join(project, 'node_modules/@threenative/playtest/dist/runner/cli.js'),
            resolve('packages/runtime-native/scenarios/starter-ui-overlay-desktop.playtest.json'),
            '--target', 'desktop', '--executable', executable, '--project', project,
            '--artifacts', resolve('packages/runtime-native/artifacts/release-container-macOS/gameplay'),
            '--host-arg', '--windowed',
          ], { stdio: 'inherit', timeout: 180_000 });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
      # The verifier writes its capture and report into the project, which the starter upload above
      # already passed by. Collect them into the release-container evidence so the frame is
      # retrievable and attributable to this exact candidate, not produced and then discarded.
      - name: Collect the release container's capture and report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP"
          if [ "${{ matrix.platform }}" = "Windows" ]; then root=$(cygpath -u "$RUNNER_TEMP"); fi
          target="$root/threenative-starter-native"
          evidence="packages/runtime-native/artifacts/release-container-${{ matrix.platform }}"
          mkdir -p "$evidence"
          for name in starter-container.png starter-container.log starter-container-report.json; do
            [ -f "$target/artifacts/native/$name" ] && cp "$target/artifacts/native/$name" "$evidence/$name"
          done
          echo "${{ github.sha }}" > "$evidence/candidate.sha"
          ls -l "$evidence"
      - name: Launch the relocated container with no developer toolchain
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          container="$TN_RELEASE_CONTAINER_ROOT"
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            executable=$(find "$container" -maxdepth 1 -name '*.exe' -type f -print)
            # git-bash PATH entries are POSIX paths separated by ':'; a 'C:\...' value is not a
            # valid bash PATH and would prove nothing about a reduced environment.
            clean_path='/c/Windows/System32'
          else
            executable=$(find "$container/Contents/MacOS" -maxdepth 1 -type f -print)
            clean_path='/usr/bin:/bin'
          fi
          [ -n "$executable" ] || { echo "TN_DESKTOP_CONTAINER_EXECUTABLE_MISSING: no executable under $container" >&2; exit 1; }
          log="$RUNNER_TEMP/clean-player-launch.log"
          echo "clean-player PATH: $clean_path"
          # The engine checkout and its Node stay off this PATH: the unpacked app must run on a
          # player machine with no developer toolchain.
          PATH="$clean_path" "$executable" --windowed --screenshot "$RUNNER_TEMP/clean-player.png" --frames 300 2>&1 | tee "$log"
          grep -q 'TN_NATIVE_SMOKE_READY:webgpu' "$log"
          grep -qE 'Rendered [0-9]+ frames' "$log"
      - name: Sign the distributed executable through the packager's own adapter
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root=$(cygpath -u "$RUNNER_TEMP")
          project="$root/threenative-starter-native"
          target="$root/signed-proof.exe"
          executable=$(find "$TN_RELEASE_CONTAINER_ROOT" -maxdepth 1 -name '*.exe' -type f -print)
          [ -n "$executable" ] || { echo "TN_DESKTOP_SIGNING_PROOF: no executable in the container" >&2; exit 1; }
          cp "$executable" "$target"
          # signDesktopArtifact itself, from the installed package - the code under test, not a
          # hand-rolled signtool call that could pass while the adapter is broken. The script lives
          # in the project and imports by relative path: a bare specifier would depend on the
          # package's exports map, and NODE_PATH does not apply to ES modules at all.
          cat > "$project/sign-proof.mjs" <<'PROOF'
          import { signDesktopArtifact } from './node_modules/@threenative/runtime-native/scripts/desktop-distribution.mjs';
          const result = signDesktopArtifact({
            platform: 'win32',
            signing: { subject: process.env.TN_SIGN_SUBJECT },
            target: process.env.TN_SIGN_TARGET,
          });
          if (result.scheme !== 'signtool' || result.signed !== true) {
            throw new Error(`TN_DESKTOP_SIGNING_PROOF: adapter reported ${JSON.stringify(result)}`);
          }
          console.log(`TN_DESKTOP_SIGNING_PROOF_SCHEME:${result.scheme}`);
          PROOF
          cd "$project"
          TN_SIGN_SUBJECT='ThreeNative CI Signing Proof' TN_SIGN_TARGET="$(cygpath -w "$target")" \
            node sign-proof.mjs 2>&1 | tee "$root/sign-proof.log"
          grep -q 'TN_DESKTOP_SIGNING_PROOF_SCHEME:signtool' "$root/sign-proof.log"
      - name: Read the signature back off the artifact
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent of the adapter that wrote it: Windows itself is asked whether this is signed.
          $target = Join-Path $env:RUNNER_TEMP 'signed-proof.exe'
          $sig = Get-AuthenticodeSignature -FilePath $target
          Write-Host "status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "TN_DESKTOP_SIGNING_PROOF: signature status $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike '*ThreeNative CI Signing Proof*') { throw 'TN_DESKTOP_SIGNING_PROOF: unexpected signer' }
      - name: Install and play the final signed Windows setup, then uninstall it
        if: matrix.platform == 'Windows'
        shell: pwsh
        # The hosted Windows runner has no GPU: its adapter is `Microsoft Basic Render Driver`. The
        # acceptance is declared here, at the one caller that knows it, like the other Windows steps.
        env:
          TN_PLAYTEST_ALLOW_SOFTWARE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'threenative-starter-native'
          $installers = @(Get-ChildItem (Join-Path $project 'dist-native') -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one final Windows installer' }
          $verifier = Join-Path $project 'node_modules/@threenative/runtime-native/scripts/verify-windows-installer.mjs'
          node $verifier --require-signed --installer $installers[0].FullName --project $project --scenario packages/runtime-native/scenarios/starter-ui-overlay-desktop.playtest.json --artifacts packages/runtime-native/artifacts/release-container-Windows/installed-game
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows gameplay or uninstall failed' }
      - name: Upload the desktop release container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-desktop-release-${{ matrix.platform }}
          path: |
            packages/runtime-native/artifacts/release-container-${{ matrix.platform }}/
            ${{ runner.temp }}/threenative-starter-native/artifacts/native/starter-container*
            ${{ runner.temp }}/threenative-starter-native/dist-native/*-setup.exe
            ${{ runner.temp }}/threenative-starter-native/dist-native/*.zip
          if-no-files-found: warn
      - name: Collect bounded desktop performance evidence from the built runtime
        if: always()
        shell: bash
        run: |
          set +e
          status=2
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            artifact=packages/runtime-native/build/tn-windows/mystral.exe
          else
            artifact=packages/runtime-native/build/tn-macos/mystral
          fi
          mkdir -p packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}
          if [ -f "$artifact" ]; then
            # Preserve path-only source state before the profiler observes cleanliness.
            git status --porcelain=v1 --untracked-files=all \
              | tee "packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}/source-status.txt"
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target desktop --duration 1 --cold-starts 1 \
              --warmup 1 --repetitions 1 --hosted-software --prebuilt-artifact "$artifact" \
              --out "packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}"
            status=$?
          else
            echo "TN_PERF_DESKTOP_ARTIFACT_MISSING: $artifact" >&2
          fi
          collector_status=BLOCKED
          if [ "$status" -eq 0 ]; then collector_status=PASS; fi
          if [ "$status" -eq 1 ]; then collector_status=FAIL; fi
          printf '{"artifact":"%s","collectorExitCode":%s,"platform":"%s","provenance":"hosted-software","status":"%s"}\n' \
            "$artifact" "$status" "${{ matrix.platform }}" "$collector_status" \
            > packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}/collector-status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > packages/runtime-native/artifacts/performance-contract/${{ matrix.platform }}/collector-contract.json
          set -e
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-${{ matrix.platform }}
          path: packages/runtime-native/artifacts/
          if-no-files-found: error

      - name: Bind the exact supported native build to this attempt
        if: always()
        shell: bash
        env:
          TN_CI_NATIVE_REUSABLE: ${{ inputs.selection_plan != '' }}
          TN_CI_PLAN: ${{ needs.scope.outputs.plan }}
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || (github.event_name == 'push' && github.ref_name) || '' }}
          TN_CI_CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TN_CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TN_CI_JOB_RESULT: ${{ job.status }}
          TN_CI_NATIVE_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-native-receipts.mjs --write
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}-desktop-${{ matrix.platform }}
          path: artifacts/ci-native-receipts/*.json
          if-no-files-found: error
          retention-days: 2

  starter-linux:
    name: Scaffolded starter desktop artifact (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.selection == 'full' && inputs.ios_only != true
    strategy:
      fail-fast: false
      # The arm64 row is not a row an ordinary pull request owes: it is the free hosted
      # `ubuntu-24.04-arm`, kept for main, the nightly and an explicit audit so the arm64 host keeps
      # proving itself on the branch that ships it. `scope` shapes the rows from the tier it
      # resolved, so this job runs linux-x64 alone on a reduced run and both rows otherwise. The
      # routing values live beside the shaping, on the runner PRD-480 fixed: the movable x64 leg
      # goes through the TN_RUNNER switch and falls back to the same hosted image, arm64 stays
      # hosted because the owner's machine is x64. That shaping is never empty — a run owing no
      # native lane at all is skipped at the call site in ci.yml, so the tiers that reach this job
      # always owe x64 — and a leg the tier does drop is skipped by the `desktop` and
      # `ios-simulator` `if:` gates, which GitHub reports as skipped, not failed.
      matrix: ${{ fromJSON(needs.scope.outputs.starter_rows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
      # ccache wrote here while actions/cache saved ${{ runner.temp }}/ccache, a directory that
      # never existed. The save skipped every time, `gh cache list` held no native-ccache entry
      # after five runs, and every job recompiled from scratch while the workflow read as though
      # it were cached. This value and the cache step's `path` must stay the same path — and it
      # has to be spelled with `github.workspace`, because job-level `env` cannot see the
      # `runner` context at all: `${{ runner.temp }}` here is what GitHub rejects outright with
      # "This run likely failed because of a workflow file issue" and zero jobs started.
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 900M
      CCACHE_COMPRESS: "1"
      # CMake reads the launcher from these two environment variables (cmake-env-variables(7));
      # it does not read CMAKE_PROJECT_INCLUDE_BEFORE from the environment at all. Setting a file
      # there configured nothing: probed against cmake 4.4.2, the include-before env var leaves
      # zero ccache references in the generated build, while these two put `ccache /usr/bin/cc` on
      # the compile line. Job-level env also reaches the QuickJS configure and the MSVC steps,
      # which a preset-only fix would miss.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - name: Restore native third-party dependencies
        uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # The lane name is part of the namespace on purpose: this job, native `starter-linux`
          # and ci `test` compile different target sets, and while all three saved under
          # `native-ccache-<os>-<arch>-gcc-` each restored whichever sibling finished last and
          # recompiled its own objects against it. See the note in ci.yml's `test` job.
          key: native-ccache-starter-linux-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-${{ github.run_id }}
          restore-keys: native-ccache-starter-linux-${{ runner.os }}-${{ runner.arch }}-gcc-${{ hashFiles('packages/runtime-native/CMakeLists.txt', 'packages/runtime-native/CMakePresets.json', 'packages/runtime-native/**/*.cmake') }}-
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ccache
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Zero the compiler cache counters
        shell: bash
        run: ccache --zero-stats
      - name: Build and pack the scaffold dependencies
        run: |
          pnpm --filter @threenative/runtime-native native:build
          mkdir -p "$RUNNER_TEMP/threenative-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/threenative-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Report the compiler cache hit rate
        if: always() && env.CCACHE_UNAVAILABLE != '1'
        shell: bash
        run: ccache --show-stats
      - name: Scaffold the native starter from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/threenative-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-starter-native
          template: starter
      - name: Build and verify the scaffolded starter
        run: |
          target="$RUNNER_TEMP/threenative-starter-native"
          pnpm --dir "$target" install --ignore-scripts
          # This runner has no GPU: its Vulkan ICD is Mesa lavapipe, the llvmpipe software
          # rasteriser (see the desktop parity job's own note). The lane declares that here, at the
          # caller that knows it, instead of teaching the harness that a native target may always
          # accept a software adapter — a local desktop run on this same machine still fails.
          THREENATIVE_RUNTIME_BINARY="$PWD/packages/runtime-native/build/tn-linux/mystral" \
          TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS=30000 \
          TN_PLAYTEST_ALLOW_SOFTWARE=1 \
            pnpm --dir "$target" test:native
      # PRD-365 acceptance criterion 1, Linux flavour of the desktop release container: tar.gz, no
      # zip, and the verifier finds the packaged xvfb.sh itself. The debug step above is untouched.
      - name: Build the desktop release container
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-starter-native"
          THREENATIVE_RUNTIME_BINARY="$PWD/packages/runtime-native/build/tn-linux/mystral" \
            pnpm --dir "$target" exec threenative build --target desktop --mode release
      - name: Relocate and extract the release container outside the project
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-starter-native"
          # The space in the destination is the point: the unpacked container must launch wherever a
          # player put it, so it is relocated out of the build tree before it is verified.
          dest="$RUNNER_TEMP/tn relocated/unpacked"
          rm -rf "$RUNNER_TEMP/tn relocated"
          mkdir -p "$dest"
          # dist-native also holds the debug build's raw executable and ui/, so match the release
          # archive by extension instead of a project name that varies per scaffold.
          archive=$(find "$target/dist-native" -maxdepth 1 -type f -name '*.tar.gz' -print)
          archive_count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            archive_count=$((archive_count + 1))
          done <<< "$archive"
          if [ "$archive_count" -ne 1 ]; then
            echo "TN_DESKTOP_RELEASE_ARCHIVE_COUNT: expected exactly one release archive under $target/dist-native, found: $archive" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$dest"
          # Locate the container root by its manifest; this also ignores a stray __MACOSX entry an
          # archiver may add, which a bare "one top-level directory" check would mistake for a root.
          manifest=$(find "$dest" -name threenative-container.json -type f -print)
          manifest_count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            manifest_count=$((manifest_count + 1))
          done <<< "$manifest"
          if [ "$manifest_count" -ne 1 ]; then
            echo "TN_DESKTOP_CONTAINER_MANIFEST_COUNT: expected exactly one threenative-container.json under $dest, found: $manifest" >&2
            exit 1
          fi
          case "$manifest" in
            */threenative-container.json) container=${manifest%/threenative-container.json} ;;
            *) echo "TN_DESKTOP_CONTAINER_MANIFEST_LAYOUT: unrecognised manifest path $manifest" >&2; exit 1 ;;
          esac
          echo "TN_RELEASE_CONTAINER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "TN_RELEASE_CONTAINER_ROOT=$container" >> "$GITHUB_ENV"
      - name: Record the release container identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="packages/runtime-native/artifacts/release-container-${{ matrix.platform }}"
          mkdir -p "$evidence"
          # git-bash carries sha256sum, macOS only shasum; do not assume either.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$TN_RELEASE_CONTAINER_ARCHIVE" | tee "$evidence/archive.sha256"
          else
            sha256sum "$TN_RELEASE_CONTAINER_ARCHIVE" | tee "$evidence/archive.sha256"
          fi
          manifest=$(find "$TN_RELEASE_CONTAINER_ROOT" -name threenative-container.json -type f -print)
          cp "$manifest" "$evidence/container-manifest.json"
      - name: Assert the container carries the game's OS identity
        shell: bash
        run: |
          set -euo pipefail
          # The packaging tool exiting 0 is not the same as the identity being in the artifact.
          container="$TN_RELEASE_CONTAINER_ROOT"
          manifest="$container/threenative-container.json"
          # node, not python3: git-bash on the Windows runner has no `python3` on PATH, and node is
          # already guaranteed by the setup-node step above.
          read_app() { node -e "const m=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(m.app[process.argv[2]]??''))" "$1" "$2"; }
          name=$(read_app "$manifest" name)
          icon=$(read_app "$manifest" icon)
          entry=$(find "$container/share/applications" -maxdepth 1 -name '*.desktop' -type f -print)
          [ -n "$entry" ] || { echo "TN_DESKTOP_IDENTITY_ENTRY_MISSING: no .desktop entry in the container." >&2; exit 1; }
          cat "$entry"
          grep -q "^Name=$name$" "$entry" || { echo "TN_DESKTOP_IDENTITY_NAME: .desktop Name= is not '$name'." >&2; exit 1; }
          grep -q '^Exec=' "$entry" || { echo "TN_DESKTOP_IDENTITY_EXEC: .desktop carries no Exec= line." >&2; exit 1; }
          [ -n "$icon" ] && [ -f "$container/$icon" ] || {
            echo "TN_DESKTOP_IDENTITY_ICON_MISSING: recorded icon '$icon' is absent from the container." >&2; exit 1; }
      - name: Verify the relocated release container with the installed verifier
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-starter-native"
          cd "$target"
          # The installed verifier, not the engine checkout: it is the copy a player gets.
          node "$target/node_modules/@threenative/runtime-native/scripts/verify-starter-desktop.mjs" \
            --container "$TN_RELEASE_CONTAINER_ROOT" \
            --project "$target"
      # The runner has no GPU, so the Vulkan ICD is Mesa lavapipe (llvmpipe software rasteriser).
      # Record what the relocated release actually bound rather than assuming it: PRD-399 states
      # "lavapipe software Vulkan" only because this evidence names it.
      - name: Record the WebGPU adapter the relocated release bound
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-starter-native"
          evidence="packages/runtime-native/artifacts/release-container-${{ matrix.platform }}"
          mkdir -p "$evidence"
          log="$target/artifacts/native/starter-container.log"
          [ -f "$log" ] || {
            echo "TN_DESKTOP_ADAPTER_LOG_MISSING: the installed verifier wrote no $log." >&2; exit 1; }
          grep -E '\[WebGPU\] (Adapter|Vendor|Backend):' "$log" | tee "$evidence/adapter.txt"
          test -s "$evidence/adapter.txt" || {
            echo "TN_DESKTOP_ADAPTER_MISSING: the relocated release recorded no WebGPU adapter." >&2; exit 1; }
      - name: Upload the release container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-desktop-release-${{ matrix.platform }}
          path: |
            packages/runtime-native/artifacts/release-container-${{ matrix.platform }}/
            ${{ runner.temp }}/threenative-starter-native/artifacts/native/starter-container*
          if-no-files-found: warn
      - name: Collect starter evidence
        if: always()
        run: |
          mkdir -p packages/runtime-native/artifacts/starter-${{ matrix.platform }}
          source="$RUNNER_TEMP/threenative-starter-native/artifacts/native"
          if [ -d "$source" ]; then
            cp -a "$source/." packages/runtime-native/artifacts/starter-${{ matrix.platform }}/
          else
            echo "starter verifier produced no artifact directory: $source"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-starter-${{ matrix.platform }}
          path: packages/runtime-native/artifacts/starter-${{ matrix.platform }}/
          if-no-files-found: error

      - name: Bind the exact supported native build to this attempt
        if: always()
        shell: bash
        env:
          TN_CI_NATIVE_REUSABLE: ${{ inputs.selection_plan != '' }}
          TN_CI_PLAN: ${{ needs.scope.outputs.plan }}
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || (github.event_name == 'push' && github.ref_name) || '' }}
          TN_CI_CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TN_CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TN_CI_JOB_RESULT: ${{ job.status }}
          TN_CI_NATIVE_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-native-receipts.mjs --write
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}-starter-linux-${{ matrix.platform }}
          path: artifacts/ci-native-receipts/*.json
          if-no-files-found: error
          retention-days: 2

  ios-simulator:
    name: iOS simulator runtime and no-Xcode consumer handoff
    needs: scope
    # A macOS-15 runner and an Apple toolchain are the opposite of a Linux row, so an ordinary pull
    # request's reduced matrix (PRD-380 phase 2) skips this leg. It still runs on main, the nightly,
    # an explicit audit and any merge group or pull request into main.
    if: needs.scope.outputs.selection == 'full' && needs.scope.outputs.native_tier == 'full'
    # Runs on every event since 2026-09-01 (owner call) — see android-emulator-parity.
    runs-on: macos-15
    timeout-minutes: 60
    # Non-blocking since 2026-09-23: iOS is not a supported target (owner decision, see
    # docs/PRDs/production-readiness/README.md). The lane still runs and reports its own red, but a
    # red here no longer fails the reusable workflow, so it cannot hold the develop->main
    # promotion's `ci-required` verdict. `native-release.yml` still validates the iOS rows for a
    # release, so dropping this from the merge verdict does not weaken release provenance.
    continue-on-error: true
    # The simulator verifier and the exact no-Xcode consumer handoff passed in isolated run
    # 33498394620 on 2026-09-01, including the worker proof, package telemetry, and consumer
    # physics scenarios. The job is fail-closed: a later regression is visible immediately on
    # every PR and every push, with no label to remember and no lane to opt into.
    env:
      TN_CI_SHA: ${{ needs.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build iOS proof workspace dependencies
        run: |
          set -euo pipefail
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name _; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" --if-present run build
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Snapshot iOS archive package outputs
        run: |
          set -euo pipefail
          missing=()
          for config in packages/*/tsup.config.ts; do
            directory="${config%/tsup.config.ts}"
            [ -f "$directory/dist/index.js" ] || missing+=("$directory/dist/index.js")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "TN_IOS_PACKAGE_OUTPUTS_MISSING: ${missing[*]}" >&2
            exit 1
          fi
          snapshot="$RUNNER_TEMP/threenative-package-outputs.sha256"
          pnpm tsx scripts/ios-package-output-snapshot.ts > "$snapshot"
          test -s "$snapshot"
      - run: rustup target add aarch64-apple-ios-sim
      - run: node packages/runtime-native/scripts/verify-ios-simulator.mjs
      - name: Archive the scenario-verified unsigned simulator host
        run: |
          app=$(find packages/runtime-native/build/tn-ios-simulator -name threenative-ios.app -type d -print -quit)
          test -n "$app"
          archive="$RUNNER_TEMP/threenative-ios-simulator-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          sha=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          echo "THREENATIVE_IOS_SIMULATOR_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "THREENATIVE_IOS_SIMULATOR_SHA256=$sha" >> "$GITHUB_ENV"
          cp "$archive" packages/runtime-native/artifacts/ios/
      - name: Verify iOS archive package outputs before packing
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/threenative-package-outputs.sha256"
          current="$RUNNER_TEMP/threenative-package-outputs-current.sha256"
          pnpm tsx scripts/ios-package-output-snapshot.ts > "$current"
          if ! cmp -s "$snapshot" "$current"; then
            echo "TN_IOS_PACKAGE_OUTPUTS_CHANGED: public archive package outputs changed during simulator verification" >&2
            diff -u "$snapshot" "$current" || true
            exit 1
          fi
      - name: Pack the exact consumer packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-packages"
          pnpm tsx scripts/workspace-packages.ts --archives > "$RUNNER_TEMP/threenative-package-specs"
          while IFS=$'\t' read -r package_name archive_prefix; do
            [ -n "$package_name" ] || continue
            pnpm --filter "$package_name" pack --pack-destination "$RUNNER_TEMP/ios-packages"
          done < "$RUNNER_TEMP/threenative-package-specs"
      - name: Scaffold the iOS consumer from local tarballs
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/ios-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-ios-consumer
          template: minimal
      - name: Install the exact consumer packages without lifecycle compilation
        run: |
          target="$RUNNER_TEMP/threenative-ios-consumer"
          cp examples/native-smoke/src/physics.ts "$target/src/game.ts"
          cp examples/native-smoke/vite.config.ts "$target/vite.config.ts"
          cp packages/physics/__tests__/fixtures/physics-parity.scenario.json \
            "$target/physics-parity.scenario.json"
          pnpm --dir "$target" install --ignore-scripts
          echo "IOS_CONSUMER_TARGET=$target" >> "$GITHUB_ENV"
      - name: Build and run the consumer app without CMake, Xcodebuild, or Rust
        run: |
          mkdir -p "$RUNNER_TEMP/ios-toolchain-mask"
          for command in cargo cmake ninja rustc xcodebuild; do
            printf '#!/bin/sh\nprintf "%%s\\n" "$0 $*" >> "$TN_IOS_TOOLCHAIN_LOG"\nexit 97\n' \
              > "$RUNNER_TEMP/ios-toolchain-mask/$command"
            chmod +x "$RUNNER_TEMP/ios-toolchain-mask/$command"
          done
          export TN_IOS_TOOLCHAIN_LOG="$RUNNER_TEMP/ios-toolchain-invocations.log"
          export PATH="$RUNNER_TEMP/ios-toolchain-mask:$PATH"
          app="$IOS_CONSUMER_TARGET/dist-native/threenative-ios-consumer.app"
          run_ios() {
            scenario=$1
            artifacts=$2
            node packages/playtest/dist/runner/cli.js "$scenario" \
              --target ios --app "$app" --bundle-id "$bundle_id" \
              --timeout 30000 \
              --artifacts "$artifacts"
          }
          expect_ios_failure() {
            scenario=$1
            artifacts=$2
            expected=$3
            log=$4
            set +e
            run_ios "$scenario" "$artifacts" > "$log" 2>&1
            status=$?
            set -e
            test "$status" -eq 1
            grep -F "$expected" "$log"
          }

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=normal \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          report="$app.json"
          bundle_id=$(node -e 'const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (typeof report.appId !== "string" || report.appId.length === 0) throw new Error("TN_IOS_CONSUMER_BUNDLE_ID_MISSING"); process.stdout.write(report.appId);' "$report")
          echo "TN_IOS_CONSUMER_BUNDLE_ID:$bundle_id"
          test -d "$app"
          run_ios examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-pass
          expect_ios_failure examples/native-smoke/playtests/physics-wrong-height.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-wrong-height \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-wrong-height.log"
          expect_ios_failure examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-mask-normal \
            TN_PLAYTEST_MOVEMENT_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-mask-normal.log"

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=masked \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          run_ios examples/native-smoke/playtests/physics-mask.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-mask-pass

          THREENATIVE_PHYSICS_PROOF=enabled THREENATIVE_PHYSICS_CONTROL=wrong-gravity \
            pnpm --dir "$IOS_CONSUMER_TARGET" build --target ios
          expect_ios_failure examples/native-smoke/playtests/physics.playtest.json \
            packages/runtime-native/artifacts/ios/consumer-physics-wrong-gravity \
            TN_PLAYTEST_POSITION_REACH_ASSERTION_FAILED "$RUNNER_TEMP/ios-consumer-wrong-gravity.log"
          test ! -e "$TN_IOS_TOOLCHAIN_LOG"
      - name: Collect iOS consumer packaging telemetry
        if: always()
        run: |
          telemetry="packages/runtime-native/artifacts/ios/consumer-package"
          mkdir -p "$telemetry"
          report="$RUNNER_TEMP/threenative-ios-consumer/dist-native/threenative-ios-consumer.app.json"
          if [ -f "$report" ]; then
            cp "$report" "$telemetry/package-report.json"
            node -e 'const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(`TN_IOS_PACKAGE_PLIST_FORMAT:${report.infoPlistFormat ?? "missing"}`);' "$report"
          else
            echo '{"available":false,"reason":"consumer packager did not produce a report"}' \
              > "$telemetry/package-report.json"
            echo "TN_IOS_PACKAGE_PLIST_FORMAT:unavailable"
          fi
      # The React-over-game pixel proof (PRD-399 P4-d) is not yet passing: the page loads, runs and
      # receives state, yet the simulator capture shows no overlay (the frame stays landscape on a
      # portrait capture). Until it passes it runs only in the dedicated iOS dispatch
      # (`ios_only: true`) rather than holding every pull request; the evidence steps below still run.
      - name: Scaffold the iOS React UI consumer from local tarballs
        if: ${{ inputs.ios_only == true }}
        uses: ./.github/actions/scaffold-from-tarballs
        with:
          archives-directory: ${{ runner.temp }}/ios-packages
          specs-file: ${{ runner.temp }}/threenative-package-specs
          target: ${{ runner.temp }}/threenative-ios-ui
          template: starter
      - name: Verify packaged iOS React state reaches visible pixels
        if: ${{ inputs.ios_only == true }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/threenative-ios-ui"
          cp packages/runtime-native/tests/fixtures/ui-cadence/game.ts "$target/src/game.ts"
          # Keep the same barcode away from phone cutouts; its bit layout is unchanged.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const source = readFileSync('packages/runtime-native/tests/fixtures/ui-cadence/main.tsx', 'utf8');
          writeFileSync(join(process.env.RUNNER_TEMP, 'threenative-ios-ui/src/ui/main.tsx'),
            source.replace('left: 16,', 'left: 96,').replace('top: 16,', 'top: 96,'));
          NODE
          pnpm --dir "$target" install --ignore-scripts
          pnpm --dir "$target" build:ios
          app="$target/dist-native/threenative-ios-ui.app"
          bundle_id=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).appId)' "$app.json")
          node "$target/node_modules/@threenative/playtest/dist/runner/cli.js" \
            "$GITHUB_WORKSPACE/packages/runtime-native/scenarios/ui-state-ios.playtest.json" \
            --target ios --app "$app" --bundle-id "$bundle_id" --project "$target" \
            --artifacts "$GITHUB_WORKSPACE/packages/runtime-native/artifacts/ios/web-ui"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { PNG } from 'pngjs';
          import { decodeUiScreenshot } from './packages/runtime-native/scripts/ui-cadence.mjs';
          const root = 'packages/runtime-native/artifacts/ios/web-ui';
          const image = PNG.sync.read(readFileSync(`${root}/after.png`));
          const visible = decodeUiScreenshot(image, 96, 96);
          const entries = JSON.parse(readFileSync(`${root}/console.json`, 'utf8'));
          const published = entries.flatMap(({ text }) => {
            const sample = /TN_UI_SAMPLE:(\{[^\r\n]*\})/.exec(text)?.[1];
            return sample ? [JSON.parse(sample).sequence] : [];
          });
          assert.ok(published.includes(visible.sequence), 'Visible React state was not published by this app');
          writeFileSync(`${root}/visible-state.json`, JSON.stringify({ ...visible,
            measurement: 'One simulator screenshot; cadence, latency and touch input remain unverified' }));
          console.log(`TN_IOS_WEB_UI_VISIBLE:${JSON.stringify(visible)}`);
          NODE
      - name: Check iOS UI packaging and asset confinement on the Apple host
        run: pnpm --dir packages/runtime-native exec vitest run --config vitest.config.ts tests/ios-packaging.test.mjs tests/ui-layer-host-contract.test.mjs
      - run: >-
          pnpm exec vitest run
          packages/playtest/__tests__/ios-driver.spec.ts
          packages/playtest/__tests__/ios-device-playtest.spec.ts
      - name: Collect bounded iOS simulator evidence without claiming a phone run
        if: always()
        run: |
          set +e
          root=packages/runtime-native/artifacts/performance-contract/ios-simulator
          mkdir -p "$root"
          app=$(find packages/runtime-native/build/tn-ios-simulator -name threenative-ios.app -type d -print -quit)
          status=2
          if [ -n "$app" ]; then
            node packages/runtime-native/scripts/profile-production.mjs \
              --profile production --target ios --device ios-simulator \
              --duration 1 --cold-starts 1 --warmup 1 --repetitions 1 \
              --hosted-software \
              --prebuilt-artifact "$app" --out "$root"
            status=$?
          else
            echo "TN_PERF_IOS_SIMULATOR_ARTIFACT_MISSING: threenative-ios.app" >&2
          fi
          printf '{"artifact":"%s","collectorExitCode":%s,"provenance":"simulator","status":"UNVERIFIED"}\n' \
            "$app" "$status" > "$root/collector-status.json"
          node packages/runtime-native/scripts/production-evidence.mjs \
            > "$root/collector-contract.json"
          set -e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ios-simulator
          path: |
            packages/runtime-native/artifacts/ios/
            packages/runtime-native/artifacts/performance-contract/
            ${{ runner.temp }}/ios-consumer-*.log
          if-no-files-found: error

  completion:
    name: Native required coverage receipt
    needs: [scope, web-reference, android-v8-source, android-emulator-parity, desktop-parity, release-reports, performance-coverage, networking-matrix, desktop, starter-linux, ios-simulator, publish-android-v8]
    # Isolated iOS dispatch remains advisory and emits no full qualification receipt.
    if: ${{ always() && inputs.ios_only != true }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    outputs:
      coverage_receipt: ${{ steps.collect.outputs.coverage_receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.candidate_sha || inputs.candidate_sha || github.sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: ci-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts/ci-native-receipts
      - id: collect
        env:
          TN_CI_NATIVE_REUSABLE: ${{ inputs.selection_plan != '' }}
          TN_CI_PLAN: ${{ needs.scope.outputs.plan }}
          TN_CI_EVENT: ${{ github.event_name }}
          TN_CI_BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || (github.event_name == 'push' && github.ref_name) || '' }}
          TN_CI_CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TN_CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-native-receipts.mjs --collect artifacts/ci-native-receipts
