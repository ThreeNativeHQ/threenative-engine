name: Performance regression hardware lanes

on:
  schedule:
    - cron: "47 4 * * *"
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      lane:
        description: "Optional lane id; leave empty for every declared platform row"
        required: false
        type: string
      baseline_source_sha:
        description: "Reviewed accepted-baseline source SHA; scheduled runs use the repository baseline variable when empty"
        required: false
        type: string
      candidate_source_sha:
        description: "Candidate source SHA"
        required: false
        type: string
      trusted:
        description: "Allow code to reach an isolated hardware runner"
        required: false
        default: false
        type: boolean
      release_soak:
        description: "Run the delegated two-hour physical-device release soak"
        required: false
        default: false
        type: boolean
      soak_platform:
        description: "Release soak platform (android or ios)"
        required: false
        type: string
      soak_device:
        description: "Named physical device identifier for the release soak"
        required: false
        type: string
      soak_app:
        description: "Signed Android APK or iOS app path for the release soak"
        required: false
        type: string
      soak_candidate_sha:
        description: "Exact source SHA covered by the release soak"
        required: false
        type: string

# The workflow has no privileged pull-request trigger. Hardware runs execute source code, so only
# the nightly schedule or an explicitly trusted manual dispatch may reach a device.
concurrency:
  group: performance-regression-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hardware-pairs:
    name: ${{ matrix.result_key }} paired hardware evidence
    # Unprovisioned phones report on hosted Linux; only configured, trusted dispatch reaches a device.
    runs-on: ${{ (matrix.physical == true && (vars.TN_PERF_PHYSICAL_PROVISIONED != 'true' || !(github.event_name == 'schedule' || inputs.trusted == true))) && 'ubuntu-24.04' || matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TN_PERF_DEVICE: ${{ matrix.device }}
      TN_PERF_PHYSICAL_EVIDENCE: ${{ matrix.physical_evidence }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: browser-webgpu
            result_key: browser-webgpu
            runner: ubuntu-24.04
            resource: browser-webgpu-runner
            device: ''
            physical_evidence: ''
          - lane: native-linux
            result_key: native-linux
            runner: ubuntu-24.04
            resource: linux-gpu-performance-runner
            device: ''
            physical_evidence: ''
          - lane: browser-moving-ladder
            result_key: browser-moving-ladder
            runner: ubuntu-24.04
            resource: browser-webgpu-runner
            device: ''
            physical_evidence: ''
          - lane: native-windows
            result_key: native-windows
            runner: windows-2025
            resource: windows-gpu-performance-runner
            device: ''
            physical_evidence: ''
          - lane: native-macos
            result_key: native-macos
            runner: macos-15
            resource: macos-gpu-performance-runner
            device: ''
            physical_evidence: ''
          - lane: native-android
            physical: true
            result_key: native-android
            runner: [self-hosted, linux, android, android-physical-performance-device]
            resource: android-physical-performance-device
            device: ''
            physical_evidence: ''
          - lane: native-ios
            physical: true
            result_key: native-ios
            runner: [self-hosted, macOS, ios, ios-physical-performance-device]
            resource: ios-physical-performance-device
            device: ''
            physical_evidence: ''
    concurrency:
      group: performance-device-${{ matrix.resource }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated source checkouts inside the repository worktree
        if: inputs.lane == '' || inputs.lane == matrix.lane || inputs.lane == matrix.result_key
        env:
          BASELINE_INPUT: ${{ inputs.baseline_source_sha }}
          CANDIDATE_INPUT: ${{ inputs.candidate_source_sha }}
          REVIEWED_BASELINE_INPUT: ${{ vars.TN_PERF_REVIEWED_BASELINE_SHA }}
          TN_PERF_LANE: ${{ matrix.lane }}
          TN_PERF_RESOURCE_READY: ${{ matrix.physical != true || vars.TN_PERF_PHYSICAL_PROVISIONED == 'true' }}
          TN_PERF_RESULT_KEY: ${{ matrix.result_key }}
        run: |
          set -euo pipefail
          baseline_sha="${BASELINE_INPUT:-${REVIEWED_BASELINE_INPUT:-}}"
          candidate_sha="${CANDIDATE_INPUT:-$GITHUB_SHA}"
          if [ "$TN_PERF_RESOURCE_READY" != "true" ]; then
            exit 0
          fi
          baseline_metadata="$(
            node --input-type=module <<'NODE'
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("scripts/performance-regression/lanes.json", "utf8"));
            const lane = manifest.lanes.find((candidate) => candidate.id === process.env.TN_PERF_LANE);
            if (lane === undefined) {
              throw new Error(`lane ${process.env.TN_PERF_LANE} is not declared by scripts/performance-regression/lanes.json`);
            }
            process.stdout.write(JSON.stringify({
              reason: lane.baseline?.reason ?? `lane baseline is ${lane.baseline?.status ?? "missing"}`,
              sourceSha: lane.baseline?.identity?.sourceSha ?? "",
              status: lane.baseline?.status ?? "missing",
            }));
          NODE
          )"
          baseline_status="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$baseline_metadata")"
          baseline_from_manifest="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).sourceSha)' "$baseline_metadata")"
          baseline_reason="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).reason)' "$baseline_metadata")"
          baseline_sha="${BASELINE_INPUT:-$baseline_from_manifest}"
          if [ "$baseline_status" != "accepted" ] || [ -z "$baseline_sha" ]; then
            export BASELINE_REASON="$baseline_reason"
            export BASELINE_STATUS="$baseline_status"
            export CANDIDATE_SOURCE_SHA="$candidate_sha"
            mkdir -p artifacts/performance-regression
            node --input-type=module <<'NODE'
            import { writeFile } from "node:fs/promises";
            const result = {
              candidateSourceSha: process.env.CANDIDATE_SOURCE_SHA,
              lane: process.env.TN_PERF_LANE,
              reason: `lane baseline is ${process.env.BASELINE_STATUS}; ${process.env.BASELINE_REASON}; no collector ran`,
              resultKey: process.env.TN_PERF_RESULT_KEY,
              status: "UNVERIFIED",
            };
            await writeFile(
              `artifacts/performance-regression/${process.env.TN_PERF_RESULT_KEY}.json`,
              `${JSON.stringify(result, null, 2)}\n`,
            );
          NODE
            echo "TN_PERF_BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "TN_PERF_BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"
          if [ -z "$baseline_sha" ] || [ -z "$candidate_sha" ] || [ "$baseline_sha" = "$candidate_sha" ]; then
            if [ -z "$baseline_sha" ]; then
              reason="TN_PERF_BASELINE_MISSING: a reviewed baseline SHA is required"
            elif [ -z "$candidate_sha" ]; then
              reason="TN_PERF_CANDIDATE_MISSING: a candidate SHA is required"
            else
              reason="TN_PERF_SELF_COMPARISON: baseline and candidate source SHAs must differ"
            fi
            mkdir -p artifacts/performance-regression
            TN_PERF_SOURCE_FAILURE_REASON="$reason" \
            TN_PERF_BASELINE_SOURCE_SHA="$baseline_sha" \
            TN_PERF_CANDIDATE_SOURCE_SHA="$candidate_sha" \
            node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const value = {artifactHash: "source-pair-validation", candidateSourceSha: process.env.TN_PERF_CANDIDATE_SOURCE_SHA || null, exitCode: 2, lane: process.env.TN_PERF_LANE, provenance: "unverified", reason: process.env.TN_PERF_SOURCE_FAILURE_REASON, resultKey: process.env.TN_PERF_RESULT_KEY, sourceSha: process.env.TN_PERF_BASELINE_SOURCE_SHA || null, status: "BLOCKED"}; await writeFile(`artifacts/performance-regression/${process.env.TN_PERF_RESULT_KEY}.json`, `${JSON.stringify(value, null, 2)}\n`);'
            printf '%s\n' "$reason" >&2
            exit 2
          fi
          git fetch --no-tags origin "$baseline_sha" "$candidate_sha"
          mkdir -p "$GITHUB_WORKSPACE/.worktrees"
          baseline_worktree="$GITHUB_WORKSPACE/.worktrees/performance-baseline-${{ matrix.result_key }}"
          candidate_worktree="$GITHUB_WORKSPACE/.worktrees/performance-candidate-${{ matrix.result_key }}"
          git worktree add --detach "$baseline_worktree" "$baseline_sha"
          git worktree add --detach "$candidate_worktree" "$candidate_sha"
          {
            echo "BASELINE_SOURCE_SHA=$baseline_sha"
            echo "CANDIDATE_SOURCE_SHA=$candidate_sha"
            echo "BASELINE_WORKTREE=$baseline_worktree"
            echo "CANDIDATE_WORKTREE=$candidate_worktree"
          } >> "$GITHUB_ENV"
      - name: Run independent alternating baseline/candidate pairs
        env:
          TN_TRUSTED_DISPATCH: ${{ github.event_name == 'schedule' || inputs.trusted == true }}
          TN_PERF_LANE: ${{ matrix.lane }}
          TN_PERF_RESULT_KEY: ${{ matrix.result_key }}
          TN_PERF_SELECTED: ${{ inputs.lane == '' || inputs.lane == matrix.lane || inputs.lane == matrix.result_key }}
          TN_PERF_RESOURCE_READY: ${{ matrix.physical != true || vars.TN_PERF_PHYSICAL_PROVISIONED == 'true' }}
        run: |
          set +e
          if [ "$TN_PERF_SELECTED" != "true" ] || [ "$TN_PERF_RESOURCE_READY" != "true" ]; then
            mkdir -p artifacts/performance-regression
            node --input-type=module -e 'import {writeFile} from "node:fs/promises"; await writeFile(`artifacts/performance-regression/${process.env.TN_PERF_RESULT_KEY}.json`, JSON.stringify({lane:process.env.TN_PERF_LANE,status:process.env.TN_PERF_SELECTED === "true" ? "UNVERIFIED" : "SKIPPED",reason:"platform not selected or physical resource unprovisioned; no collector ran"}));'
            exit 0
          fi
          if [ "${TN_PERF_BASELINE_AVAILABLE:-true}" != "true" ]; then
            exit 0
          fi
          args=(
            --manifest scripts/performance-regression/lanes.json
            --lane "${{ matrix.lane }}"
            --baseline-source-sha "$BASELINE_SOURCE_SHA"
            --candidate-source-sha "$CANDIDATE_SOURCE_SHA"
            --baseline-worktree "$BASELINE_WORKTREE"
            --candidate-worktree "$CANDIDATE_WORKTREE"
            --out "artifacts/performance-regression/${{ matrix.result_key }}.json"
          )
          if [ -n "$TN_PERF_DEVICE" ]; then args+=(--device "$TN_PERF_DEVICE"); fi
          if [ -n "$TN_PERF_PHYSICAL_EVIDENCE" ]; then args+=(--physical-evidence "$TN_PERF_PHYSICAL_EVIDENCE"); fi
          if [ "$TN_TRUSTED_DISPATCH" = "true" ]; then args+=(--trusted); fi
          pnpm tsx scripts/performance-regression/run.ts "${args[@]}"
          status=$?
          set -e
          if [ ! -f "artifacts/performance-regression/${{ matrix.result_key }}.json" ]; then
            mkdir -p artifacts/performance-regression
            node --input-type=module -e 'import { writeFile } from "node:fs/promises"; await writeFile(process.argv[1], `${JSON.stringify({candidateSourceSha: process.env.CANDIDATE_SOURCE_SHA, exitCode: 2, lane: process.env.TN_PERF_LANE, provenance: "unverified", reason: "performance runner did not produce a result", resultKey: process.env.TN_PERF_RESULT_KEY, sourceSha: process.env.BASELINE_SOURCE_SHA, status: "BLOCKED"}, null, 2)}\n`);' "artifacts/performance-regression/${{ matrix.result_key }}.json"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: performance-regression-${{ matrix.result_key }}
          path: artifacts/performance-regression/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: performance-regression-${{ matrix.result_key }}-failure
          path: artifacts/performance-regression/
          retention-days: 30
          if-no-files-found: warn

  performance-summary:
    name: Performance regression evidence summary
    needs: hardware-pairs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate requested performance lane
        env:
          TN_PERF_SELECTED_LANE: ${{ inputs.lane }}
        run: pnpm tsx scripts/performance-regression/ci-summary.ts --validate-selected-lane "$TN_PERF_SELECTED_LANE" --manifest scripts/performance-regression/lanes.json
      - name: Download every available platform result
        uses: actions/download-artifact@v7
        with:
          pattern: performance-regression-*
          path: artifacts/performance-regression
          merge-multiple: true
      - name: Fill missing matrix rows and aggregate fail-closed evidence
        env:
          TN_PERF_EXPECTED_SHA: ${{ inputs.candidate_source_sha || github.sha }}
          TN_PERF_CANCELLED: ${{ needs.hardware-pairs.result == 'cancelled' }}
          TN_PERF_SELECTED_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance-regression
          node packages/runtime-native/scripts/production-evidence.mjs \
            > artifacts/performance-regression/collector-contract.json
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";

          const manifest = JSON.parse(await readFile("scripts/performance-regression/lanes.json", "utf8"));
          const expectedRows = [
            { lane: "browser-webgpu", resultKey: "browser-webgpu" },
            { lane: "browser-moving-ladder", resultKey: "browser-moving-ladder" },
            { lane: "native-linux", resultKey: "native-linux" },
            { lane: "native-windows", resultKey: "native-windows" },
            { lane: "native-macos", resultKey: "native-macos" },
            { lane: "native-android", resultKey: "native-android" },
            { lane: "native-ios", resultKey: "native-ios" },
          ];
          const selectedLane = process.env.TN_PERF_SELECTED_LANE ?? "";
          const manifestByLane = new Map(manifest.lanes.map((lane) => [lane.id, lane]));
          const selected = (row) => selectedLane === "" || selectedLane === row.lane || selectedLane === row.resultKey;
          const required = (row) => selected(row) || manifestByLane.get(row.lane)?.required === true;
          const rowsByResultKey = new Map(expectedRows.map((row) => [row.resultKey, row]));
          const root = "artifacts/performance-regression";
          const files = await readdir(root).catch(() => []);
          const results = [];
          for (const file of files.filter((name) => name.endsWith(".json"))) {
            const value = JSON.parse(await readFile(`${root}/${file}`, "utf8"));
            if (typeof value.lane !== "string" || typeof value.status !== "string") continue;
            const resultKey = file.slice(0, -5);
            const row = rowsByResultKey.get(resultKey);
            results.push({
              artifactHash: value.artifactHash,
              lane: value.lane,
              reason: value.reason,
              required: row === undefined
                ? manifestByLane.get(value.lane)?.required === true
                : required(row),
              resultKey,
              sourceSha: value.candidateSourceSha ?? value.sourceSha,
              status: value.status,
            });
          }
          const seen = new Set(results.map((result) => result.resultKey));
          for (const row of expectedRows) {
            if (seen.has(row.resultKey)) continue;
            results.push({
              lane: row.lane,
              reason: selected(row)
                ? "selected matrix row did not publish evidence"
                : "matrix row was not selected",
              required: required(row),
              resultKey: row.resultKey,
              status: selected(row) ? "BLOCKED" : "SKIPPED",
            });
          }
          if (process.env.TN_PERF_CANCELLED === "true") {
            results.push({
              artifactHash: "workflow-cancelled",
              lane: "performance-workflow",
              reason: "cancelled run cannot publish PASS",
              required: true,
              resultKey: "performance-workflow",
              sourceSha: process.env.TN_PERF_EXPECTED_SHA,
              status: "BLOCKED",
            });
          }
          await writeFile(
            "artifacts/performance-regression/summary-input.json",
            `${JSON.stringify({
              expectedSha: process.env.TN_PERF_EXPECTED_SHA,
              requiredLanes: expectedRows.filter(required).map(({ resultKey }) => resultKey),
              results,
            }, null, 2)}\n`,
          );
          NODE
          set +e
          pnpm tsx scripts/performance-regression/ci-summary.ts \
            --input artifacts/performance-regression/summary-input.json \
            --expected-sha "$TN_PERF_EXPECTED_SHA" \
            --out artifacts/performance-regression/summary.json \
            | tee artifacts/performance-regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
      - name: Check calibration and CI-cost promotion policy separately from baseline regeneration
        run: |
          set -euo pipefail
           node --input-type=module -e 'import { readFile } from "node:fs/promises"; const policy = JSON.parse(await readFile("scripts/performance-regression/lanes.json", "utf8")).promotionPolicy; if (policy.calibrationPairs !== 10 || policy.minimumCalibrationSessions !== 3 || policy.accuracyRuns !== 20 || policy.ciCostRuns !== 20) throw new Error("promotion policy evidence requirements changed without the required calibration/cost sample counts"); if (policy.requiredCheckPromotion === policy.baselineRegeneration) throw new Error("required-check promotion must remain separate from baseline regeneration");'
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: performance-regression-summary
          path: artifacts/performance-regression/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: performance-regression-summary-failure
          path: artifacts/performance-regression/
          retention-days: 30
          if-no-files-found: warn

  weekly-workload-rotation:
    name: Weekly full template workload rotation
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the existing full template workload rotation
        run: pnpm test:templates

  release-soak:
    name: Delegated physical release soak
    if: github.event_name == 'workflow_dispatch' && inputs.release_soak == true
    runs-on: ubuntu-latest
    timeout-minutes: 130
    concurrency:
      group: performance-release-soak-${{ inputs.soak_device || 'unselected-device' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the existing PRD-058 physical qualification tool for two hours
        env:
          SOAK_APP: ${{ inputs.soak_app }}
          SOAK_CANDIDATE_SHA: ${{ inputs.soak_candidate_sha || github.sha }}
          SOAK_DEVICE: ${{ inputs.soak_device }}
          SOAK_PLATFORM: ${{ inputs.soak_platform }}
        run: |
          set +e
          mkdir -p artifacts/release-soak
          status=2
          if [ -n "$SOAK_APP" ] && [ -n "$SOAK_CANDIDATE_SHA" ] && [ -n "$SOAK_DEVICE" ]; then
            case "$SOAK_PLATFORM" in
              android) app_args=(--android-app "$SOAK_APP"); status=0 ;;
              ios) app_args=(--ios-app "$SOAK_APP"); status=0 ;;
              *) echo "TN_PERF_SOAK_PLATFORM_INVALID: expected android or ios" >&2 ;;
            esac
            if [ "$status" -eq 0 ]; then
              pnpm native:qualify:physical \
                --platform "$SOAK_PLATFORM" --device "$SOAK_DEVICE" \
                "${app_args[@]}" --candidate-sha "$SOAK_CANDIDATE_SHA" \
                --duration-ms 7200000 --cadence-ms 1000 --out .runtime/prd056/prd358-release-soak
              status=$?
            fi
          else
            echo "TN_PERF_SOAK_INPUT_MISSING: signed app, physical device, platform, and candidate SHA are required" >&2
          fi
          mkdir -p .runtime/prd056/prd358-release-soak
          cp -R .runtime/prd056/prd358-release-soak/. artifacts/release-soak/ 2>/dev/null || true
          printf '{"candidateSha":"%s","durationMs":7200000,"platform":"%s","provenance":"physical-hardware","status":"%s"}\n' \
            "$SOAK_CANDIDATE_SHA" "$SOAK_PLATFORM" "$([ "$status" -eq 0 ] && echo PASS || echo BLOCKED)" \
            > artifacts/release-soak/status.json
          node packages/runtime-native/scripts/production-evidence.mjs \
            > artifacts/release-soak/collector-contract.json
          set -e
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: performance-release-soak
          path: artifacts/release-soak/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: performance-release-soak-failure
          path: artifacts/release-soak/
          retention-days: 30
          if-no-files-found: warn

  required-check-promotion:
    name: Required-check promotion remains maintainer-owned
    needs: performance-summary
    if: ${{ always() && needs.performance-summary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Keep promotion separate from baseline regeneration
        run: |
          echo "required-check-promotion requires maintainer review after calibration evidence"
          echo "baseline-regeneration is a separate-reviewed-change and never runs in this gate"

  velocity-cost:
    name: Temporal-off velocity submission cost
    # PRD-550 phase 1. This arm prices actual frame submission against split-control noise, so any
    # other job on the machine reports its load as render cost. The merge path's integration lane
    # therefore runs only `--variant=history`, and this measurement runs on the scheduled lane.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - name: Build this commit's public bridge and runner
        run: pnpm --filter @threenative/playtest build
      - name: Measure the temporal-off CPU submission cost
        run: pnpm exec tsx scripts/verify-velocity-history.ts --variant=cost
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: velocity-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/velocity-history/
          retention-days: 30
          if-no-files-found: warn
