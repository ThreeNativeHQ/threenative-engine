      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this source's public JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Verify native preflight and capture rejection controls
        run: pnpm exec vitest run scripts/__tests__/fluid-collision-proof.spec.ts scripts/__tests__/fluid-collision-native-proof.spec.ts --maxWorkers=1
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the ordinary ARM desktop host from this source
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Run the same authored four-arm proof and missing-gate control
        env:
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx scripts/verify-fluid-collision-native.ts
      - name: Retain native pixels and minimal source provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fluid-collision-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: |
            artifacts/fluid-collision-native/**/*.png
            artifacts/fluid-collision-native/summary.json
            artifacts/fluid-collision-native/failure.json
          if-no-files-found: error
      - name: Record exact current-attempt integration receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_JOB_RESULT: ${{ job.status }}
        run: node "$GITHUB_WORKSPACE/scripts/ci-integration-receipts.mjs" --write
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-integration-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ github.job }}
          path: ${{ github.workspace }}/artifacts/ci-integration-receipts/${{ github.job }}.json
          if-no-files-found: error

  # The flaky browser fluid-consumers gate is deliberately retired.
  # Keep observe-fluid-ci.mjs / verify-fluid-consumers.ts for explicit diagnostics;
  # fluid-collision CPU and fluid-collision-native remain required when selected.

  packaged-quickjs:
    name: packaged native asset fallback
    if: ${{ !github.event.pull_request.draft && needs.paths.outputs.native-assets == 'true' }}
    needs: paths
    # Match native-platforms starter-linux: this architecture selects QuickJS/wgpu without
    # changing any runtime default. Native dependencies use the repository's locked provisioner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TN_PLAYTEST_ALLOW_SOFTWARE: '1'
      TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this commit's JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Validate real compressed-source normalization and capture guards
        run: >-
          pnpm exec vitest run --maxWorkers=1
          packages/create-threenative/__tests__/vq-native-asset-capabilities.spec.ts
          packages/create-threenative/__tests__/vq-native-fixture.spec.ts
          scripts/__tests__/native-asset-capture-proof.spec.ts
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the same QuickJS host the normal ARM desktop lane ships
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Build the real fixture and capture its packaged native executable
        env:
          THREENATIVE_RUNTIME_BINARY: ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral
        run: node --import tsx scripts/verify-native-asset-capabilities.ts
      - name: Retain raw native captures, artifact identities and decoded payload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vq01-native-assets-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: artifacts/vq01-native-assets/
          retention-days: 30
          if-no-files-found: warn
      - name: Record exact current-attempt integration receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_JOB_RESULT: ${{ job.status }}
        run: node "$GITHUB_WORKSPACE/scripts/ci-integration-receipts.mjs" --write
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-integration-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ github.job }}
          path: ${{ github.workspace }}/artifacts/ci-integration-receipts/${{ github.job }}.json
          if-no-files-found: error

  exposure:
    name: auto-exposure
    if: ${{ !github.event.pull_request.draft && needs.paths.outputs.exposure == 'true' }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
          save-bundles: 'false'
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm exec vitest run --maxWorkers=1 packages/create-threenative/__tests__/auto-exposure.spec.ts packages/create-threenative/__tests__/auto-exposure-node.spec.ts packages/create-threenative/__tests__/auto-exposure-proof.spec.ts packages/create-threenative/__tests__/auto-exposure-mutations.spec.ts packages/create-threenative/__tests__/auto-exposure-clock.spec.ts packages/create-threenative/__tests__/auto-exposure-camera.spec.ts
      - name: Capture the real exposure graph
        run: node --import tsx packages/create-threenative/__tests__/fixtures/auto-exposure/verify.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd339-exposure-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: artifacts/prd339-exposure
          if-no-files-found: error
      - name: Record exact current-attempt integration receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_JOB_RESULT: ${{ job.status }}
        run: node "$GITHUB_WORKSPACE/scripts/ci-integration-receipts.mjs" --write
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-integration-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ github.job }}
          path: ${{ github.workspace }}/artifacts/ci-integration-receipts/${{ github.job }}.json
          if-no-files-found: error

  cold-boot:
    name: auto-exposure cold boot
    if: ${{ !github.event.pull_request.draft && needs.paths.outputs.cold-boot == 'true' }}
    needs: paths
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER) && 'ubuntu-24.04' || vars.TN_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
        with:
          pack-archives: 'false'
          save-bundles: 'false'
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm exec vitest run --maxWorkers=1 packages/create-threenative/__tests__/auto-exposure.spec.ts packages/create-threenative/__tests__/auto-exposure-node.spec.ts packages/create-threenative/__tests__/auto-exposure-proof.spec.ts packages/create-threenative/__tests__/auto-exposure-mutations.spec.ts packages/create-threenative/__tests__/auto-exposure-clock.spec.ts packages/create-threenative/__tests__/auto-exposure-cold-boot.spec.ts
      - name: Capture twenty independent exposure cold boots
        run: node --import tsx packages/create-threenative/__tests__/fixtures/auto-exposure/verifyColdBoot.ts
      - name: Qualify first-update snap response and zero-gain expected failure
        run: node --import tsx packages/create-threenative/__tests__/fixtures/auto-exposure/verifySnap.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prd339-cold-boot-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: |
            artifacts/prd339-cold-boot
            artifacts/prd339-snap-response
      - name: Record exact current-attempt integration receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_JOB_RESULT: ${{ job.status }}
        run: node "$GITHUB_WORKSPACE/scripts/ci-integration-receipts.mjs" --write
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-integration-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-${{ github.job }}
          path: ${{ github.workspace }}/artifacts/ci-integration-receipts/${{ github.job }}.json
          if-no-files-found: error

  completion:
    name: Verify required integration receipts
    needs: [paths, csg, ik, vegetation, decals, decals-native, tone, animation, animation-native, fog, fog-native, capture, fluid-collision, fluid-collision-native, packaged-quickjs, exposure, cold-boot, temporal, velocity]
    if: ${{ always() }}
    runs-on: ${{ (github.event.pull_request.head.repo.fork || !vars.TN_RUNNER_LIGHT) && 'ubuntu-24.04' || vars.TN_RUNNER_LIGHT }}
    timeout-minutes: 5
    outputs:
      coverage_receipt: ${{ steps.collect.outputs.coverage_receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: needs.paths.outputs.required_jobs != '[]'
        with:
          pattern: ci-integration-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}-*
          path: artifacts/integration-receipts
      - id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_PATHS_RESULT: ${{ needs.paths.result }}
        run: |
          set -euo pipefail
          test "$TN_CI_PATHS_RESULT" = success
          node scripts/ci-integration-receipts.mjs --collect artifacts/integration-receipts
