  animation-native:
    name: Linux native locomotion correctness
    needs: [animation]
    # The browser capture cannot say what the compiled runtime does with the same blend-space
    # trace, and a stale host binary answers for the wrong source. Build this candidate's ARM
    # desktop host and run the authored scenario file unchanged, so the lane's own scenario is
    # the native proof rather than a second near-copy of it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TN_PLAYTEST_ALLOW_SOFTWARE: '1'
      TN_PLAYTEST_NATIVE_SCREENSHOT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Build this source's public JavaScript packages
        uses: ./.github/actions/workspace-dist
        with:
          save-bundles: 'false'
          pack-archives: 'false'
      - name: Restore checksum-provisioned native dependencies
        uses: actions/cache/restore@v4
        with:
          path: packages/runtime-native/third_party
          key: native-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs', 'packages/runtime-native/scripts/package-android.mjs') }}
      - name: Install the existing native lane's system prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
          libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev
          libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev libxcomposite-dev xcompmgr
          libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb zlib1g-dev
      - name: Build the ordinary ARM desktop host from this source
        run: pnpm --filter @threenative/runtime-native native:build
      - name: Bundle the authored locomotion entry for the native host
        run: node packages/runtime-native/scripts/bundle.mjs --project examples/abyss-framework --entry src/render/vq-locomotion-game.ts --target desktop --output examples/abyss-framework/dist/vq-locomotion-native.js
      - name: Record this run's host identity beside its screenshots
        run: |
          mkdir -p examples/abyss-framework/artifacts/playtest
          sha256sum packages/runtime-native/build/tn-linux/mystral > examples/abyss-framework/artifacts/playtest/native-host-identity.txt
          git rev-parse HEAD >> examples/abyss-framework/artifacts/playtest/native-host-identity.txt
      - name: Run the authored locomotion trace on the freshly built host
        # A non-zero CLI status fails the step, so a run that never reached its assertions fails too.
        run: sh scripts/xvfb.sh node packages/playtest/dist/runner/cli.js playtests/vq-locomotion-blend-spaces.playtest.json --target desktop --executable ${{ github.workspace }}/packages/runtime-native/build/tn-linux/mystral --project examples/abyss-framework --host-arg run --host-arg dist/vq-locomotion-native.js
      - name: Retain native screenshots, host console and executable identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vq04-locomotion-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: examples/abyss-framework/artifacts/playtest
          retention-days: 30
          if-no-files-found: warn
      - name: Record exact current-attempt integration receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TN_CI_JOB_RESULT: ${{ job.status }}
        run: node "$GITHUB_WORKSPACE/scripts/ci-integration-receipts.mjs" --write
