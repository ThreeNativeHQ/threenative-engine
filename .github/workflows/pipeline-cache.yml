name: Pipeline cache verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pipeline-cache.yml
      - packages/runtime-native/**
      - packages/playtest/**
      - patches/wgpu-native@25.0.2.2.patch
  # No `feat/prd-368-persistent-pipeline-cache`: the lane it was opened for landed on 2026-09-10 and
  # the branch only kept a 31-minute android-arm64 ABI job alive on every push nobody was reading
  # (2.4k runner-minutes over 41 runs, PRD-481). A per-branch trigger outlives its pull request by
  # default; `scripts/__tests__/ci-structure.spec.ts` now fails closed on the next one.
  push:
    branches: [main]
    paths:
      - .github/workflows/pipeline-cache.yml
      - packages/runtime-native/**
      - packages/playtest/**
      - patches/wgpu-native@25.0.2.2.patch

permissions:
  contents: read

concurrency:
  group: pipeline-cache-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Execute filesystem faults under ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pipeline-cache-storage
          g++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            packages/runtime-native/tests/pipeline_cache_test.cpp \
            packages/runtime-native/src/webgpu/pipeline_cache.cpp -o /tmp/cache-contract
          ASAN_OPTIONS=detect_leaks=1 /tmp/cache-contract 2>&1 | tee artifacts/pipeline-cache-storage/result.log
          git rev-parse HEAD > artifacts/pipeline-cache-storage/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-cache-storage-contract
          path: artifacts/pipeline-cache-storage
          retention-days: 14
          if-no-files-found: error

  measurement-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/workspace-dist
      - name: Verify protocol, parser integration, and owned playtest build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pipeline-cache-measurement
          # vitest, not `node --test`: packages/runtime-native/vitest.config.ts collects
          # tests/**/*.test.{ts,mjs}, so these files are part of the runtime-native suite and a
          # second runner invoking them directly makes their runner import ambiguous. Under
          # `node --test` a vitest-imported file reports zero tests and exits 1.
          (cd packages/runtime-native && pnpm exec vitest run --config vitest.config.ts \
            tests/pipeline-cache-measurement.test.mjs \
            tests/pipeline-cache-protocol.test.mjs \
            tests/wgpu-cache-toolchain.test.mjs) \
            2>&1 | tee artifacts/pipeline-cache-measurement/node.log
          pnpm exec vitest run packages/playtest/__tests__/pipeline-cache-perf.spec.ts \
            packages/playtest/__tests__/perf.spec.ts \
            2>&1 | tee artifacts/pipeline-cache-measurement/vitest.log
          pnpm --filter @threenative/playtest typecheck 2>&1 | tee artifacts/pipeline-cache-measurement/typecheck.log
          pnpm --filter @threenative/playtest build 2>&1 | tee artifacts/pipeline-cache-measurement/build.log
          pnpm exec biome check packages/playtest/src/runner/perf.ts \
            packages/playtest/src/runner/pipeline-cache-observations.ts packages/playtest/__tests__/pipeline-cache-perf.spec.ts \
            packages/runtime-native/scripts/measure-pipeline-cache.mjs packages/runtime-native/scripts/pipeline-cache-measurement.mjs \
            packages/runtime-native/scripts/verify-pipeline-cache-relaunch.mjs \
            packages/runtime-native/tests/pipeline-cache-measurement.test.mjs packages/runtime-native/tests/pipeline-cache-protocol.test.mjs \
            2>&1 | tee artifacts/pipeline-cache-measurement/lint.log
          git rev-parse HEAD > artifacts/pipeline-cache-measurement/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-cache-measurement-contract
          path: artifacts/pipeline-cache-measurement
          retention-days: 14
          if-no-files-found: error

  patched-backend:
    name: Patched cache ABI (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # PRD-221's resumable V8 producer reserves 180 minutes plus cache-save time.
    timeout-minutes: ${{ matrix.target == 'android-arm64' && 240 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, android-arm64]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/wgpu-cache-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain probe below resolves the real NDK on this runner, so it is worth failing
      # on before the Rust build. It runs under vitest like the rest of that suite, which needs
      # the workspace toolchain this job previously did without.
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same runner as the suite that owns the file; see the note on the measurement step.
      - working-directory: packages/runtime-native
        run: pnpm exec vitest run --config vitest.config.ts tests/wgpu-cache-toolchain.test.mjs
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Provision pinned compiler tools
        run: |
          sdkmanager 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/wgpu-cache-${{ matrix.target }}
          key: wgpu-cache-25.0.2.2-rust1.90-ndk27-${{ matrix.target }}-${{ hashFiles('patches/wgpu-native@25.0.2.2.patch') }}
      - name: Reconstruct owned patched backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pipeline-cache
          dep=wgpu
          if test '${{ matrix.target }}' = android-arm64; then dep=wgpu-android; fi
          node packages/runtime-native/scripts/download-deps.mjs --only "$dep"
          node packages/runtime-native/scripts/download-deps.mjs --rebuild-wgpu-cache-api \
            --wgpu-cache-target '${{ matrix.target }}' 2>&1 | tee artifacts/pipeline-cache/reconstruction.log
          git rev-parse HEAD > artifacts/pipeline-cache/revision.txt
          tar czf artifacts/pipeline-cache/backend.tar.gz -C packages/runtime-native/third_party "$dep"
      - name: Select the Android host NDK from Gradle
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          # Bindgen owns its NDK above; the host and V8/STL must use Gradle's recipe.
          version=$(sed -n 's/^android.ndkVersion=//p' packages/runtime-native/android/gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sdkmanager "ndk;$version"
          ndk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/$version"
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk" "$ndk" >> "$GITHUB_ENV"
      - name: Reuse the resumable V8 source producer when installed
        # This source producer arrives with PRD-221. Do not fall back after it fails;
        # before that change, the existing dependency provisioner remains authoritative.
        if: matrix.target == 'android-arm64' && hashFiles('packages/runtime-native/scripts/build-android-v8.mjs') != ''
        uses: ./.github/actions/android-v8-source
      - name: Compile Android host against reconstructed backend
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          for dep in v8-android sdl3-android stb webp-source; do
            node packages/runtime-native/scripts/download-deps.mjs --only "$dep"
          done
          cmake -S packages/runtime-native -B packages/runtime-native/build/prd368-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DMYSTRAL_USE_V8=ON -DMYSTRAL_USE_QUICKJS=OFF -DMYSTRAL_USE_JSC=OFF \
            -DMYSTRAL_USE_WGPU=ON -DMYSTRAL_USE_DAWN=OFF \
            -DTN_ENABLE_CANVAS2D=OFF -DTN_ENABLE_WEBTRANSPORT=OFF -DTN_ENABLE_DEBUG_SERVER=OFF \
            -DTN_ENABLE_NATIVE_PHYSICS=OFF -DTN_ENABLE_VIDEO=OFF \
            2>&1 | tee artifacts/pipeline-cache/android-configure.log
          cmake --build packages/runtime-native/build/prd368-android --target mystral-runtime -j 2 \
            2>&1 | tee artifacts/pipeline-cache/android-build.log
          find packages/runtime-native/build/prd368-android -name libmystral-runtime.so -exec sha256sum {} \; \
            > artifacts/pipeline-cache/android-runtime.sha256
          test -s artifacts/pipeline-cache/android-runtime.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-cache-backend-${{ matrix.target }}
          path: artifacts/pipeline-cache
          retention-days: 14
          if-no-files-found: error

  host-contract:
    needs: patched-backend
    name: Real device and storage lifetime (not compiled-data or Pixel proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-cache-backend-linux-x64
          path: artifacts/backend
      - uses: actions/cache@v4
        with:
          path: packages/runtime-native/third_party
          key: pipeline-cache-host-deps-${{ runner.os }}-${{ hashFiles('packages/runtime-native/scripts/download-deps.mjs') }}
      - name: Provision native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libcurl4-openssl-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vulkan-tools zlib1g-dev
          for dep in sdl3 v8 stb webp swc libuv; do
            node packages/runtime-native/scripts/download-deps.mjs --only "$dep"
          done
          tar xzf artifacts/backend/backend.tar.gz -C packages/runtime-native/third_party
      - name: Build strict and envelope-only executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pipeline-cache-host
          cmake -S packages/runtime-native -B packages/runtime-native/build/prd368 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DMYSTRAL_USE_V8=ON -DMYSTRAL_USE_QUICKJS=OFF \
            -DMYSTRAL_USE_WGPU=ON -DMYSTRAL_USE_DAWN=OFF \
            -DTN_ENABLE_CANVAS2D=OFF -DTN_ENABLE_WEBTRANSPORT=OFF \
            -DTN_ENABLE_NATIVE_PHYSICS=OFF -DTN_ENABLE_VIDEO=OFF \
            2>&1 | tee artifacts/pipeline-cache-host/configure.log
          cmake --build packages/runtime-native/build/prd368 \
            --target threenative-pipeline-cache-api-test threenative-pipeline-cache-lifecycle-test -j 2 \
            2>&1 | tee artifacts/pipeline-cache-host/build.log
      - name: Preserve strict rejection and execute lifetime controls
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo --summary > artifacts/pipeline-cache-host/adapter.txt 2>&1
          grep -i llvmpipe artifacts/pipeline-cache-host/adapter.txt
          strict=packages/runtime-native/build/prd368/threenative-pipeline-cache-api-test
          set +e
          "$strict" > artifacts/pipeline-cache-host/strict-empty-driver.log 2>&1
          strict_status=$?
          set -e
          test "$strict_status" = 1
          grep 'device cache did not grow' artifacts/pipeline-cache-host/strict-empty-driver.log
          executable=packages/runtime-native/build/prd368/threenative-pipeline-cache-lifecycle-test
          "$executable" 2>&1 | tee artifacts/pipeline-cache-host/lifetime-attached.log
          TN_PIPELINE_CACHE=0 "$executable" 2>&1 | tee artifacts/pipeline-cache-host/lifetime-disabled.log
          node packages/runtime-native/scripts/verify-pipeline-cache-relaunch.mjs \
            "$executable" artifacts/pipeline-cache-host/relaunch --envelope-lifecycle-only
          git rev-parse HEAD > artifacts/pipeline-cache-host/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-cache-host-contract
          path: artifacts/pipeline-cache-host
          retention-days: 14
          if-no-files-found: error
