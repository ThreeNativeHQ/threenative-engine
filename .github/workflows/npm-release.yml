# The npm release lane publishes from `ship`, after a green CI run on main (PRD-630, owner,
# 2026-11-02: "once it hit main it simply auto publishes without new test runs"). A main commit
# whose version is already on npm does nothing. A dispatch runs only the clean room.
#
# `pnpm publish`, never `npm publish`: the workspace declares dependencies as `catalog:` and
# `workspace:*`, and only pnpm rewrites those to resolved versions on pack. A raw `npm publish`
# ships manifests that fail to install on every machine that is not this one.
name: npm release

on:
  # PRD-630: a green main commit publishes itself, if its version is not on npm yet.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Runs only the clean room, against the published `latest`.
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # `pnpm release:ship` is the one release path: resumable, and the same command a person runs when
  # this job fails. Its upgrade proof runs before the first upload, so a red there publishes nothing.
  ship:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The waits inside `release:ship` total 190 minutes, before the publish and the clean room.
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # npm Trusted Publishing: `pnpm publish` hands the tarball to the npm CLI, which trades this
      # job's OIDC token for a publish token only from npm 11.5.1. Node 20.19 bundles npm 10, which
      # falls back to NPM_TOKEN, and that secret was rejected with E404 on 0.3.10 and 0.3.11.
      - run: npm install -g npm@11.18.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # The upgrade proof installs the previous `latest`, whose packager needs this key.
      - name: Create the default Android debug keystore
        run: |
          mkdir -p ~/.android
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-engine-wasm
      - run: node packages/runtime-native/scripts/download-deps.mjs --only gradle-wrapper
      # `release.ts` checks the bundled MCP servers before it builds anything.
      - run: pnpm build
      - name: Install native desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libwebkit2gtk-4.1-0 x11-utils
      # The publish set, named one package per line so `pnpm publish:check` can assert that no
      # publishable package is missing from it. A package that exists, is not private, and is
      # absent here would be omitted from the release.
      #
      # BEGIN GENERATED WORKSPACE PUBLISH SET
      #   @threenative/assets
      #   @threenative/blender-bridge
      #   @threenative/core
      #   @threenative/metahuman
      #   @threenative/physics
      #   @threenative/playtest
      #   @threenative/procedural-animals
      #   @threenative/procedural-vegetation
      #   @threenative/raw-unreal
      #   @threenative/runtime-native
      #   @threenative/terrain
      #   @threenative/three-native
      #   @threenative/ueformat
      #   @threenative/ui
      #   create-threenative
      #   threenative-animation-mcp
      #   threenative-engine-mcp
      # END GENERATED WORKSPACE PUBLISH SET
      - name: Ship this commit
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TN_PLAYTEST_ALLOW_SOFTWARE: "1"
        # A rerun leaves out `--auto`, so a failed clean room cannot turn green with no new check.
        run: pnpm release:ship --yes --sha "$SHA" ${{ github.run_attempt == 1 && '--auto' || '' }}

  clean-room:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Raised from 20 when the `android` step joined this job, then from 30 when the first hosted
    # run (37709499660) was killed by its own clock inside the verifier: both managers each pay a
    # Gradle build and a software-adapter gameplay run, and a job killed by its own clock reports a
    # failure nobody earned.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
      # What the `android` step needs, and nothing it does not: Gradle and the Kotlin plugin want
      # JDK 17, and `zipalign`/`apksigner` come from the SDK's build-tools. The step packages the
      # published `arm64-v8a` cohort into `jniLibs/`, so no NDK, CMake or emulator is involved -
      # the same NDK-free SDK `native-release.yml`'s consumer job builds its packed APK against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # `packages:` is explicit because the action's default is `tools platform-tools`, and
      # Google removed the obsolete `tools` package from the SDK repository: the default
      # now fails the whole step with `Failed to find package 'tools'`.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # The default debug key Android Studio leaves on a developer machine. runtime-native 0.3.4
      # re-signs with it and refuses when it is absent; the packager creates it itself from the
      # next cohort on (PRD-196). Remove this step once `latest` carries that packager.
      - name: Create the default Android debug keystore
        run: |
          mkdir -p ~/.android
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: pnpm install --frozen-lockfile
      # `libwebkit2gtk-4.1-0` is the desktop prebuilt's overlay webview: without it the host exits
      # 127 before `--version`, and doctor and the native step both fail on a loader error.
      # `x11-utils` carries `xdpyinfo`, which the native step needs to verify its display.
      - name: Install native desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libwebkit2gtk-4.1-0 x11-utils
      # Proves the registry path, which no other gate in this repository exercises: the sandbox,
      # the sweeps and verify-golden-path all resolve `file:` tarballs by design.
      - name: Install from the registry in a directory with no workspace above it
        # The hosted runner has no GPU, and the starter's own `test` script refuses a software
        # adapter. The playtest runner reads this acknowledgement for an unmodified project and still
        # reports the adapter it got (PRD-637).
        env:
          TN_PLAYTEST_ALLOW_SOFTWARE: "1"
        run: pnpm tsx scripts/verify-registry-install.ts
