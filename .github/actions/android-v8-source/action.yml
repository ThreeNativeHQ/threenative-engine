name: Android V8 source payload
description: Build, resume, verify, and cache the pinned Android V8 payload.

inputs:
  runtime-root:
    description: Runtime package containing the dependency provisioner.
    required: false
    default: packages/runtime-native

outputs:
  recipe-hash:
    description: Hash of the files that define the payload; names the published release asset.
    value: ${{ steps.recipe.outputs.hash }}
  published:
    description: "'true' when the payload came from the published release asset."
    value: ${{ steps.published.outputs.hit }}
  built:
    description: >-
      'true' only when this run compiled the payload. A payload restored from an artifact is
      somebody else's bytes, so it is never published as the trusted release asset.
    value: ${{ steps.build.outputs.built }}

runs:
  using: composite
  steps:
    # The recipe decides whether a cached payload is still valid. Compute it once here so every
    # cache key below agrees, and leave this action's own plumbing out of the inputs: editing the
    # workflow that restores V8 must not throw away a built V8. The script hashes the `v8-android`
    # entry of the provisioner alone, so an unrelated dependency edit in that file keeps the key
    # (PRD-628); hashing the whole file is what cold-built V8 in run 39184795139.
    - name: Compute the pinned V8 recipe hash
      id: recipe
      shell: bash
      # The hash names the release asset and every cache key below, so a node failure that an
      # `echo` swallowed would publish the payload under an empty name and miss every later run.
      run: |
        set -euo pipefail
        hash=$(node "${{ inputs.runtime-root }}/scripts/v8-recipe-hash.mjs")
        [ -n "$hash" ] || { echo "::error::the V8 recipe hash script printed nothing"; exit 1; }
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    # The durable copy. The Actions cache alone could not hold the payload: the repository's 10 GiB
    # budget is shared by every lane, and on 2026-09-28 the nightly's payload (saved 12:06) was
    # evicted before 15:48, so every PR cold-built V8 for two hours. It was also branch-scoped: a
    # payload a PR saved was invisible to every other PR. A release asset is neither. Only trusted
    # refs publish it (native-platforms.yml `publish-android-v8`); the build step below still
    # verifies the receipt and rebuilds anything that fails it.
    - name: Download the published Android V8 payload
      id: published
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ASSET: v8-android-${{ steps.recipe.outputs.hash }}.tgz
        DEST: ${{ inputs.runtime-root }}/third_party/v8-android
      run: |
        set -euo pipefail
        if gh release download ci-v8-android --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" \
          --dir "$RUNNER_TEMP" --clobber; then
          mkdir -p "$DEST"
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$DEST"
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "No published $ASSET; falling back to the artifact, the Actions cache and the source build."
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi
    # The store every ref can read. An Actions cache is scoped to the ref that saved it: a payload a
    # `workflow_dispatch` or push run on the head branch saved is invisible to that branch's pull
    # request runs, because a pull request reads only its own merge ref and its base branch (PRD-628
    # finding 2). A workflow artifact has no ref scope, so a pull request reads a payload any run of
    # its head branch built — the dispatch-then-push case included.
    #
    # Any run can upload an artifact, a fork's pull request run included, and the payload's receipt
    # is written by whoever built it. So only a pull request reads this store, `v8-artifact-pick.mjs`
    # admits only this repository's own head on main, develop or this pull request's branch, and a
    # payload that fails `--verify` is thrown away instead of failing the lane. A trusted ref never
    # reads it at all: it has the release asset, and a poisoned payload must not reach the job that
    # publishes one (`built` below is what that job requires).
    - name: Download the payload a pull request run of this recipe published
      id: artifact
      if: steps.published.outputs.hit != 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: v8-android-${{ steps.recipe.outputs.hash }}
        ROOT: ${{ inputs.runtime-root }}
        DEST: ${{ inputs.runtime-root }}/third_party/v8-android
        BRANCHES: main develop ${{ github.head_ref }}
      run: |
        set -euo pipefail
        : "${ROOT:?}" "${DEST:?}" "${RUNNER_TEMP:?}"
        if run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
          | node "$ROOT/scripts/v8-artifact-pick.mjs" --branches "$BRANCHES"); then
          :
        else
          # A missing read grant or an unreadable list is not a reason to fail the lane.
          echo "::warning::could not list the artifacts named $NAME; cold-building instead"
          run_id=""
        fi
        artifact_dir="$RUNNER_TEMP/v8-artifact"
        rm -rf "$artifact_dir"
        if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
          --name "$NAME" --dir "$artifact_dir"; then
          mkdir -p "$DEST"
          cp -a "$artifact_dir/." "$DEST/"
          if ( cd "$ROOT" && node scripts/build-android-v8.mjs --verify ); then
            rm -rf "$artifact_dir"
            echo "Restored the payload run $run_id published for $NAME."
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An artifact that vanished between the list and the download, or that carries a payload
          # failing its own receipt check, is a cold build — never a failed lane.
          echo "::warning::the payload run $run_id published for $NAME failed its receipt check; cold-building instead"
        fi
        rm -rf "$artifact_dir" "$DEST"
        echo "No usable artifact named $NAME; falling back to the Actions cache and the source build."
        echo "hit=false" >> "$GITHUB_OUTPUT"
    # The built payload is the expensive thing and it is stable per recipe. Its key carries no run
    # id, so every run of the same recipe restores it instead of cold-building V8 into the timeout.
    - name: Restore the pinned Android V8 payload
      id: payload
      if: steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.runtime-root }}/third_party/v8-android
        key: android-v8-payload-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
    # Only a payload miss needs the resumable source state. Its key keeps a per-run suffix because
    # a resumed build must save to a unique key rather than collide with the run that produced it.
    - name: Restore the resumable V8 source state
      if: steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true' && steps.payload.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.runtime-root }}/third_party/.v8-source
          ${{ inputs.runtime-root }}/third_party/v8-android
        key: >-
          android-v8-source-${{ runner.os }}-${{ runner.arch }}-
          ${{ steps.recipe.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: >-
          android-v8-source-${{ runner.os }}-${{ runner.arch }}-
          ${{ steps.recipe.outputs.hash }}-
    - name: Build the pinned Android V8 payload
      id: build
      if: steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true' && steps.payload.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.runtime-root }}
      shell: bash
      run: |
        set -euo pipefail
        : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME must select the pinned V8 NDK}"
        # The producer job is 210 minutes. A cold build on a two-core runner reached 3089 of
        # 3529 Ninja targets in 120 minutes (run 35945560551), so a 120-minute ceiling could
        # never finish one and save the payload — every fresh recipe cold-built into the timeout
        # and needed a manual re-run. 180 minutes lets one run complete and cache the payload.
        # The remaining 30 minutes let actions/cache/save archive the prepared checkout and Ninja
        # outputs after an interrupted compile, so the next run resumes instead of starting over.
        # A published payload makes this a receipt check that returns in seconds.
        export THREENATIVE_V8_BUILD_JOBS="${THREENATIVE_V8_BUILD_JOBS:-$(nproc)}"
        timeout --signal=TERM --kill-after=30s 180m \
          node scripts/download-deps.mjs --only v8-android
        # This run compiled the payload, and only such a run may publish it: what `built` promises
        # `publish-android-v8` in native-platforms.yml, so a downloaded payload never becomes the
        # trusted release asset.
        echo "built=true" >> "$GITHUB_OUTPUT"
    # Payload-only verification is valid: `--verify` inspects the installed payload and its receipt
    # under third_party/v8-android and never reads third_party/.v8-source.
    - name: Verify the complete Android V8 payload
      id: verify
      if: steps.payload.outputs.cache-hit == 'true' || steps.artifact.outputs.hit == 'true' || steps.build.outcome == 'success'
      working-directory: ${{ inputs.runtime-root }}
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build-android-v8.mjs --verify
    - name: Save the prebuilt Android V8 payload
      if: steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true' && steps.payload.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.runtime-root }}/third_party/v8-android
        key: android-v8-payload-${{ runner.os }}-${{ runner.arch }}-${{ steps.recipe.outputs.hash }}
    # The copy that outlives this ref. A pull request's own cache entry reaches that pull request
    # only, so without this upload a payload built by a PR is lost the moment the PR closes, and a
    # dispatch run on the head branch cannot warm the PR at all. Seven days covers the PR's review
    # life; a payload this old is rebuilt once and republished, never silently reused stale.
    - name: Publish the payload to every ref that shares this recipe
      if: steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true' && steps.payload.outputs.cache-hit != 'true' && steps.verify.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: v8-android-${{ steps.recipe.outputs.hash }}
        path: ${{ inputs.runtime-root }}/third_party/v8-android
        if-no-files-found: error
        retention-days: 7
    # The 3.2 GB source state only ever saves when the build was cut off mid-compile (timeout or
    # cancel); a successful build saves the payload alone. Saving it always is what evicted every
    # other repo cache entry. A superseded pull request saves too, because its Ninja progress is the
    # only thing the next push can resume from — bounded to one entry per (os, arch, recipe) by the
    # `prune-cache` job in ci-janitor.yml, which drops the older source states of the same recipe.
    - name: Save resumable V8 source state
      if: >-
        always() && steps.published.outputs.hit != 'true' && steps.artifact.outputs.hit != 'true' &&
        steps.payload.outputs.cache-hit != 'true' &&
        (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.runtime-root }}/third_party/.v8-source
          ${{ inputs.runtime-root }}/third_party/v8-android
        key: >-
          android-v8-source-${{ runner.os }}-${{ runner.arch }}-
          ${{ steps.recipe.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
