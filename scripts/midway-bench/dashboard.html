<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midway scoreboard</title>
<style>
  :root {
    --bg:#FAF9F5; --card:#F0EEE6; --ink:#141413; --mute:#5E5D59; --line:#E8E6DC; --accent:#D97757; --soft:#B0AEA5;
    --green:#15803d; --green-bg:#e8f6ee; --red:#c8261b; --red-bg:#fdeceb; --grey:#5E5D59; --grey-bg:#E8E6DC;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#262624; --card:#30302E; --ink:#F0EEE6; --mute:#B0AEA5; --line:#3F3E3B; --accent:#D97757; --soft:#B0AEA5;
    --green:#4ade80; --green-bg:#112a1b; --red:#ff7b70; --red-bg:#331512; --grey:#B0AEA5; --grey-bg:#3A3936;
  } }
  :root[data-theme="dark"] {
    --bg:#262624; --card:#30302E; --ink:#F0EEE6; --mute:#B0AEA5; --line:#3F3E3B; --accent:#D97757; --soft:#B0AEA5;
    --green:#4ade80; --green-bg:#112a1b; --red:#ff7b70; --red-bg:#331512; --grey:#B0AEA5; --grey-bg:#3A3936;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 48px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; }
  main { max-width:960px; margin:0 auto; display:grid; gap:20px; } main > * { min-width:0; }
  header { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; justify-content:space-between; }
  h1 { font-size:17px; margin:0; font-weight:650; } h2 { font-size:15px; margin:0 0 8px; font-weight:650; }
  nav.tabs { display:flex; gap:6px; } nav.tabs a { padding:4px 12px; border-radius:999px; color:var(--mute); text-decoration:none; border:1px solid var(--line); }
  nav.tabs a[aria-current] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mute { color:var(--mute); } .sm { font-size:12.5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .kpi { border-radius:10px; padding:12px 14px; background:var(--grey-bg); border-left:4px solid var(--grey); }
  .kpi.pass { background:var(--green-bg); border-color:var(--green); } .kpi.fail { background:var(--red-bg); border-color:var(--red); }
  .kpi b { display:block; font-size:12.5px; color:var(--mute); font-weight:600; }
  .kpi .v { font-size:30px; font-weight:700; line-height:1.15; } .kpi.pass .v { color:var(--green); } .kpi.fail .v { color:var(--red); }
  .kpi .t { font-size:12px; color:var(--mute); } .kpi .d { font-size:11.5px; color:var(--mute); margin-top:6px; }
  .pill { display:inline-block; border-radius:999px; padding:1px 9px; font-size:11.5px; background:var(--grey-bg); color:var(--mute); }
  .pill.pass { background:var(--green-bg); color:var(--green); } .pill.fail { background:var(--red-bg); color:var(--red); }
  .scroll { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:right; padding:4px 8px; border-top:1px solid var(--line); white-space:nowrap; } th:first-child, td:first-child { text-align:left; } th { color:var(--mute); font-weight:500; }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:6px; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  svg text { fill:var(--mute); font-size:10px; } .legend span::before { content:""; display:inline-block; width:10px; height:3px; margin-right:5px; vertical-align:middle; background:var(--lc); }
  .legend span { margin-right:12px; font-size:12px; color:var(--mute); }
</style>
</head>
<body>
<main>
<header>
  <h1>Midway scoreboard <span class="mute">· PRD-610 · native engine vs three.js</span></h1>
  <nav class="tabs"><a href="/">Epic scoreboard</a><a href="/midway" aria-current="page">Midway</a></nav>
  <span class="mute sm"><span id="dot"></span><span id="status">connecting…</span></span>
</header>
<section class="card"><h2>PRD-610 targets</h2><div class="kpis" id="kpis"></div></section>
<section class="card"><h2>Side by side, latest run per arm</h2><div class="scroll" id="side"></div></section>
<section class="card"><h2>Trend, oldest left</h2><div class="charts" id="trend"></div></section>
<section class="card"><h2>A/B groups by tag prefix</h2><div class="scroll" id="groups"></div></section>
<section class="card"><h2>Every run</h2><div class="scroll" id="runs"></div></section>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (id) => document.getElementById(id);
const n = (v, d = 2, u = "") => (v === undefined ? '<span class="mute">no samples</span>' : `${v.toFixed(d)}${u}`);
const ARM = { desktop: "Native engine (desktop)", native: "Web Wasm engine", legacy: "Web three.js" };
const COLOR = { desktop: "var(--accent)", native: "var(--soft)", legacy: "var(--ink)" };
const ms = (r) => (r.arm === "desktop" ? r.desktop?.medians.cpuFrameCpuMs : r.budget?.frameP50);
const parity = (r) => (r.parityMalformed ? '<span class="pill fail">malformed</span>' : !r.parity ? '<span class="pill">none</span>' : `<span class="pill ${r.parity.pass ? "pass" : "fail"}">${r.parity.pass ? "PASS" : "FAIL"}</span>`);

function chart(title, unit, get, runs) {
  const arms = Object.keys(ARM).map((arm) => ({ arm, pts: runs.map((r, i) => ({ i, v: r.arm === arm ? get(r) : undefined })).filter((p) => p.v !== undefined) })).filter((s) => s.pts.length);
  if (!arms.length) return `<div><b class="sm">${title}</b><p class="mute sm">no samples</p></div>`;
  const all = arms.flatMap((s) => s.pts.map((p) => p.v)), hi = Math.max(...all, 1e-9), W = 300, H = 120, x = (i) => 8 + (i / Math.max(runs.length - 1, 1)) * (W - 16), y = (v) => H - 14 - (v / hi) * (H - 30);
  const lines = arms.map((s) => `<polyline fill="none" stroke="${COLOR[s.arm]}" stroke-width="2" points="${s.pts.map((p) => `${x(p.i)},${y(p.v)}`).join(" ")}"/>${s.pts.map((p) => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3" fill="${COLOR[s.arm]}"><title>${esc(runs[p.i].dir)}: ${p.v.toFixed(2)} ${unit}</title></circle>`).join("")}`).join("");
  return `<div><b class="sm">${title}</b><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}"><line x1="8" x2="${W - 8}" y1="${H - 14}" y2="${H - 14}" stroke="var(--line)"/><text x="8" y="10">${hi.toFixed(1)} ${unit}</text>${lines}</svg></div>`;
}

function render(d) {
  $("kpis").innerHTML = d.kpis.map((k) => `<div class="kpi ${k.verdict}"><b>${k.id} · ${esc(k.title)} <span class="pill ${k.verdict}">${k.verdict}</span></b><div class="v">${k.value ? esc(k.value) : "no samples"}</div><div class="t">target: ${esc(k.target)}</div><div class="d">${esc(k.detail)}</div></div>`).join("");
  const latest = (arm) => d.runs.filter((r) => r.arm === arm && r.status === "ok").at(-1);
  const cols = Object.keys(ARM).map((arm) => [arm, latest(arm)]);
  const row = (label, f) => `<tr><th>${label}</th>${cols.map(([, r]) => `<td>${r ? f(r) : '<span class="mute">no run</span>'}</td>`).join("")}</tr>`;
  $("side").innerHTML = `<table><tr><th></th>${cols.map(([a]) => `<th>${ARM[a]}</th>`).join("")}</tr>
    ${row("Run", (r) => esc(r.dir))}
    ${row("Main-thread ms / frame", (r) => n(ms(r)))}
    ${row("Frame p95 ms", (r) => n(r.desktop?.frameP95 ?? r.budget?.frameP95))}
    ${row("Frame ms incl. present", (r) => n(r.desktop?.medians.frameMs))}
    ${row("Render CPU ms", (r) => n(r.desktop?.medians.renderCpuMs))}
    ${row("Game JS CPU ms", (r) => n(r.desktop?.medians.gameJsCpuMs))}
    ${row("Bridge calls / frame", (r) => n(r.desktop?.medians.bridgeCalls, 0))}
    ${row("FPS (budget window)", (r) => n(r.budget?.fps, 1))}
    ${row("HUD round trip p50 / p95 ms", (r) => (r.ui ? `${r.ui.p50.toFixed(1)} / ${r.ui.p95.toFixed(1)}` : '<span class="mute">no samples</span>'))}
    ${row("Matrix walk visited (last / max)", (r) => (r.matrix ? `${r.matrix.last} / ${r.matrix.max}` : '<span class="mute">no samples</span>'))}
    ${row("Parity", parity)}</table>
    <p class="mute sm">Main-thread ms per frame is desktop <code>cpuFrameCpuMs</code> against web <code>TN_FRAME_BUDGET</code> frame p50. Legacy reference: ${n(d.legacyMs, 2, " ms")} (median of all legacy runs).</p>`;
  const legend = `<p class="legend" style="grid-column:1/-1;margin:0">${Object.keys(ARM).map((a) => `<span style="--lc:${COLOR[a]}">${ARM[a]}</span>`).join("")}</p>`;
  $("trend").innerHTML = legend + chart("Main-thread ms / frame", "ms", ms, d.runs) + chart("Ratio vs legacy (higher is better)", "x", (r) => (r.arm !== "legacy" && d.legacyMs && ms(r) ? d.legacyMs / ms(r) : undefined), d.runs) + chart("HUD round trip p95", "ms", (r) => r.ui?.p95, d.runs) + chart("Matrix walk visited (last)", "nodes", (r) => r.matrix?.last, d.runs);
  $("groups").innerHTML = `<table><tr><th>Group</th><th>Arm</th><th>Runs</th><th>ms / frame</th><th>Frame p95</th><th>HUD p95</th><th>Matrix last</th><th>Parity PASS</th></tr>${d.groups.map((g) => `<tr><td>${esc(g.group)}</td><td>${g.arm}</td><td>${g.runs}</td><td>${n(g.cpuFrameMs)}</td><td>${n(g.frameP95)}</td><td>${n(g.hudP95, 1)}</td><td>${n(g.matrixLast, 0)}</td><td>${g.parityPass}/${g.runs}</td></tr>`).join("")}</table>`;
  $("runs").innerHTML = `<table><tr><th>Run</th><th>Updated</th><th>ms / frame</th><th>Frame p95</th><th>HUD p95</th><th>Matrix last</th><th>Parity</th><th>Skipped lines</th></tr>${[...d.runs].reverse().map((r) => `<tr><td>${esc(r.dir)}</td><td>${new Date(r.mtimeMs).toLocaleString()}</td><td>${r.status === "ok" ? n(ms(r)) : "no samples"}</td><td>${n(r.desktop?.frameP95 ?? r.budget?.frameP95)}</td><td>${n(r.ui?.p95, 1)}</td><td>${n(r.matrix?.last, 0)}</td><td>${parity(r)}</td><td>${r.skipped}</td></tr>`).join("")}</table>`;
}

async function tick() {
  try {
    const d = await fetch("/api/midway", { cache: "no-store" }).then((x) => x.json());
    render(d);
    $("status").textContent = `live · ${d.runs.length} runs · ${d.skipped} skipped lines · updated ${new Date().toLocaleTimeString()}`;
    $("dot").style.background = "var(--green)";
  } catch {
    $("status").textContent = "server not reachable";
    $("dot").style.background = "var(--red)";
  }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
