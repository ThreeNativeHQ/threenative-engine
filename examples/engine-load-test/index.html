<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreeNative Engine Load Test</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: #0b0f14; color: #d7f3ff; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
      canvas { display: block; }
      #status { position: fixed; top: 8px; left: 8px; padding: 6px 10px; border: 1px solid #30566a; border-radius: 6px; background: #0b0f14dd; white-space: pre; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1280" height="720"></canvas>
    <div id="status">initializing</div>
    <script>
      // PRD-573 slice 7: how long each WebAssembly compile or instantiate took before the entry ran.
      (() => {
        const times = (globalThis.__tnWasmInstantiateMs = []);
        for (const name of ["compile", "compileStreaming", "instantiate", "instantiateStreaming"]) {
          const original = WebAssembly[name];
          if (typeof original !== "function") continue;
          WebAssembly[name] = function (...args) {
            const started = performance.now();
            return original.apply(this, args).then((result) => {
              times.push(performance.now() - started);
              return result;
            });
          };
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
