<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" />
    <title>Abyss — framework port</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      if (new URLSearchParams(globalThis.location.search).has("animation-reversal")) {
        void import("/src/animation-reversal-main.ts");
      } else if (new URLSearchParams(globalThis.location.search).has("loading-leak")) {
        void import("/src/loading-leak-main.ts");
      } else if (new URLSearchParams(globalThis.location.search).has("navigation")) {
        void import("/src/navigation-main.tsx");
      } else if (new URLSearchParams(globalThis.location.search).has("scaler")) {
        void import("/src/scaler-main.ts");
      } else if (new URLSearchParams(globalThis.location.search).has("streaming")) {
        void import("/src/streaming-main.ts");
      } else if (new URLSearchParams(globalThis.location.search).has("terrain")) {
        void import("/src/terrain-main.tsx");
      } else if (new URLSearchParams(globalThis.location.search).has("vq-locomotion")) {
        void import("/src/vq-locomotion-main.ts");
      } else if (new URLSearchParams(globalThis.location.search).has("world")) {
        void import("/src/world-main.ts");
      } else {
        void import("/src/main.tsx");
      }
    </script>
  </body>
</html>
