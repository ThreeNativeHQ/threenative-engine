<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Library</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --muted: #6b7682; --line: #e3e6ea;
        --accent: #1ea7fd; --accent-ink: #ffffff; --hover: #eef6fd;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1b1d21; --panel: #22252a; --ink: #e6e8eb; --muted: #98a1ab; --line: #33373d;
          --accent: #4cb8fd; --accent-ink: #0d1b26; --hover: #2a3138;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, sans-serif;
        display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; overflow: hidden;
      }
      aside, #panel { background: var(--panel); overflow-y: auto; min-height: 0; }
      aside { border-right: 1px solid var(--line); }
      #panel { border-left: 1px solid var(--line); }
      header { padding: 14px 14px 10px; }
      h1 { margin: 0 0 10px; font-size: 15px; }
      h1 small { color: var(--muted); font-weight: 400; }
      input[type="search"], select, input[type="number"] {
        width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
        background: var(--bg); color: var(--ink); font: inherit;
      }
      details > summary {
        list-style: none; cursor: pointer; padding: 6px 14px; font-weight: 700; font-size: 11px;
        letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }
      details > summary::before { content: "▸ "; }
      details[open] > summary::before { content: "▾ "; }
      summary span { float: right; font-weight: 400; }
      a.story {
        display: block; padding: 4px 14px 4px 28px; color: var(--ink); text-decoration: none;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      a.story:hover { background: var(--hover); }
      a.story[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
      a.story em { color: var(--muted); font-style: normal; font-size: 11px; }
      a.story[aria-current="page"] em { color: inherit; }
      main { position: relative; min-width: 0; height: 100vh; overflow: hidden; }
      [hidden] { display: none !important; }
      canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #toolbar {
        position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; flex-wrap: wrap;
      }
      button {
        background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px;
        padding: 5px 9px; font: inherit; cursor: pointer;
      }
      button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      #status {
        position: absolute; bottom: 8px; left: 8px; padding: 4px 8px; border-radius: 4px;
        background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      }
      #status.error { color: #d1453b; }
      .tabs { display: flex; border-bottom: 1px solid var(--line); }
      .tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; background: transparent; }
      .tabs button[aria-pressed="true"] { box-shadow: inset 0 -2px var(--accent); color: var(--accent); background: transparent; }
      .tab { padding: 14px; display: grid; gap: 12px; }
      .tab[hidden] { display: none; }
      label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
      .row { display: flex; gap: 4px; }
      .row button { flex: 1; }
      dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      pre {
        margin: 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
        white-space: pre-wrap; word-break: break-all; font-size: 12px;
      }
      h2 { margin: 0; font-size: 16px; }
      h2 + p { margin: 2px 0 0; color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <h1>Asset Library <small>procedural-environment</small></h1>
        <input id="search" type="search" placeholder="Find an asset (oak, red rock, palm)" aria-label="Find an asset" />
        <div style="height: 6px"></div>
        <select id="biome" aria-label="Biome filter"><option value="">All biomes</option></select>
      </header>
      <nav id="tree" aria-label="Assets"></nav>
    </aside>
    <main>
      <canvas id="view" aria-label="Asset preview"></canvas>
      <div id="toolbar">
        <button id="wind" aria-pressed="true" title="Animate the _WIND attribute">Wind</button>
        <button id="wire" aria-pressed="false">Wireframe</button>
        <button id="figure" aria-pressed="true" title="A 1.8 m figure for scale">Scale figure</button>
        <button id="grid" aria-pressed="true">1 m grid</button>
        <button id="frame">Frame</button>
      </div>
      <div id="status" role="status">Loading the catalog</div>
    </main>
    <section id="panel">
      <div class="tabs">
        <button id="tab-controls" aria-pressed="true">Controls</button>
        <button id="tab-docs" aria-pressed="false">Docs</button>
      </div>
      <div id="controls" class="tab">
        <label>Seed <input id="seed" type="number" step="1" value="1" /></label>
        <label>Level of detail
          <div class="row" id="lods">
            <button data-lod="0" aria-pressed="true">0 near</button>
            <button data-lod="1" aria-pressed="false">1 mid</button>
            <button data-lod="2" aria-pressed="false">2 far</button>
          </div>
        </label>
        <label id="rock-biome-row" hidden>Rock biome <select id="rock-biome"></select></label>
        <label id="rock-detail-row" hidden>Rock detail (0 to 1; the bake's default is 0.3, Outcrop's page uses 0.5)
          <input id="rock-detail" type="number" min="0" max="1" step="0.05" value="0.3" />
        </label>
        <dl id="stats"></dl>
      </div>
      <div id="docs" class="tab" hidden></div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
