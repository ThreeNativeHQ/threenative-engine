<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>playtest fixture</title>
  </head>
  <body>
    <canvas id="view" width="640" height="360" data-engine="webgl"></canvas>
    <script>
      // A deliberately tiny stand-in for a real game. It implements the v1 bridge
      // protocol by hand so the end-to-end test exercises the runner, the bridge
      // client, and the assertion evaluator without dragging in a GPU or three.js.
      //
      // `?mode=` selects which kind of application the runner is pointed at. Each
      // mode exists to pin one verdict: `good` must report pass, every other mode
      // must report fail. A mode that reports the wrong verdict is a harness bug,
      // not a fixture bug.
      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") ?? "good";
      const fixedClock = mode === "physics" || params.get("clock") === "fixed-step";
      const canvas = document.getElementById("view");
      let startupPollsRemaining = mode === "startup-delayed" ? 3 : Infinity;

      if (mode === "generic-adapter") {
        const genericAdapter = {
          features: ["timestamp-query"],
          info: {},
          limits: { maxBindGroups: 4, maxTextureDimension2D: 4096 },
        };
        try {
          Object.defineProperty(navigator, "gpu", {
            configurable: true,
            value: { requestAdapter: async () => genericAdapter },
          });
        } catch {
          // The provenance negative control still exercises the real browser adapter below.
        }
        canvas.dataset.engine = "webgpu";
      }

      if (mode === "adapter-rejected") {
        // The provenance diagnostic used to flatten this into "no adapter": the browser's own
        // reason is the only thing that says whether the page is misconfigured or the GPU is gone.
        // Painted in 2D so the capture is not blank and the run reaches the provenance check.
        try {
          Object.defineProperty(navigator, "gpu", {
            configurable: true,
            value: {
              requestAdapter: async () => {
                throw new Error("fixture-adapter-rejected");
              },
            },
          });
        } catch {
          // The provenance negative control still exercises the real browser adapter below.
        }
        canvas.dataset.engine = "webgpu";
        const context2d = canvas.getContext("2d");
        if (context2d !== null) {
          context2d.fillStyle = "#cc3333";
          context2d.fillRect(0, 0, canvas.width, canvas.height);
          context2d.fillStyle = "#33cc33";
          context2d.fillRect(40, 40, 200, 120);
        }
      }

      if (mode !== "generic-adapter" && mode !== "adapter-rejected") {
        const gl = canvas.getContext("webgl2") ?? canvas.getContext("webgl");
        if (gl !== null) {
          gl.enable(gl.SCISSOR_TEST);
          if (mode === "rendered") {
            const colors = [
              [0.9, 0.1, 0.1, 1], [0.1, 0.8, 0.2, 1], [0.1, 0.3, 0.9, 1], [0.9, 0.8, 0.1, 1],
              [0.8, 0.1, 0.7, 1], [0.1, 0.8, 0.8, 1], [0.9, 0.5, 0.1, 1], [0.5, 0.2, 0.9, 1],
            ];
            const tileWidth = canvas.width / 4;
            const tileHeight = canvas.height / 2;
            colors.forEach((color, index) => {
              gl.scissor((index % 4) * tileWidth, Math.floor(index / 4) * tileHeight, tileWidth, tileHeight);
              gl.clearColor(...color);
              gl.clear(gl.COLOR_BUFFER_BIT);
            });
          } else {
            gl.scissor(0, 0, canvas.width, canvas.height);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
          }
          gl.disable(gl.SCISSOR_TEST);
        }
      }

      if (mode === "no-bridge-error") {
        setTimeout(() => {
          throw new Error("transport-only-boom");
        }, 0);
      }

      if (mode === "console-only") {
        console.error("phase0-console-error");
      }

      if (mode === "unhandled-rejection") {
        Promise.reject("phase2-unhandled-rejection");
      }

      if (mode === "page-error") {
        setTimeout(() => {
          throw new Error("phase2-page-error");
        }, 0);
      }

      // Lets a test observe a browser launch flag that reached this page.
      if (params.get("report") === "ua") {
        console.log(`playtest-ua:${navigator.userAgent}`);
      }

      const player = { x: 0, y: 0, z: 0 };
      let startupReadyReported = false;
      // Setup-channel state: the last applied rotation and whether the placement
      // carried the frozen marker. A real game would read these to steer or hold.
      let appliedRotation = [0, 0, 0, 1];
      let placedFrozen = false;
      const camera = { x: 0, y: 2, z: -6 };
      let held = false;
      let tick = 0;
      let sampleCount = 0;
      const physicsDebugSeries = [];
      let networkFailureSent = false;
      const worldBodies = ["player", "ground"];
      const expectedWorldBodies = worldBodies.length;
      let staleSchedulerCallbacks = 0;
      let sceneExited = false;
      const scheduledCallbacks = [];
      const replayHashes = [];

      function restartScene() {
        sceneExited = true;
        if (mode === "restart-leak") {
          // The fixture models a scene teardown that forgets to release its bodies.
          worldBodies.push("player", "ground");
        } else {
          worldBodies.splice(0, worldBodies.length, "player", "ground");
        }
        sceneExited = false;
      }

      function scheduleSceneCallback() {
        if (mode === "scheduler-leak") {
          scheduledCallbacks.push(() => {
            if (sceneExited) staleSchedulerCallbacks += 1;
          });
          sceneExited = true;
          for (const callback of scheduledCallbacks.splice(0)) callback();
        }
      }

      function physicsHash(seed, run) {
        let state = seed;
        for (let index = 0; index < 4; index += 1) {
          state = (state * 1664525 + 1013904223 + (mode === "physics-mismatch" && run === 1 ? 7 : 0)) >>> 0;
        }
        return state.toString(16);
      }

      if (mode === "restart-leak" || mode === "restart-leak-control") {
        restartScene();
      }
      if (mode === "scheduler-leak") {
        scheduleSceneCallback();
      }
      if (mode === "physics-mismatch") {
        replayHashes.push(physicsHash(90210, 0), physicsHash(90210, 1));
      }

      function runtimeDiagnostics() {
        const diagnostics = [];
        if (worldBodies.length > expectedWorldBodies) {
          diagnostics.push({
            code: "TN_PLAYTEST_WORLD_BODIES_LEAK",
            expectedWorldBodies,
            worldBodies: worldBodies.length,
          });
        }
        if (sceneExited && staleSchedulerCallbacks > 0) {
          diagnostics.push({
            callback: "stale-timer",
            code: "TN_PLAYTEST_SCHEDULER_AFTER_SCENE_EXIT",
            callbacks: staleSchedulerCallbacks,
          });
        }
        if (replayHashes.length === 2 && replayHashes[0] !== replayHashes[1]) {
          diagnostics.push({
            code: "TN_PLAYTEST_PHYSICS_HASH_MISMATCH",
            expectedHash: replayHashes[0],
            observedHash: replayHashes[1],
            seed: 90210,
          });
        }
        if (mode === "runtime-diagnostic") {
          diagnostics.push({ code: "runtime-seeded-error", message: "seeded runtime diagnostic" });
        }
        return diagnostics;
      }

      addEventListener("pointermove", (event) => {
        console.log(`playtest-pointer:${event.clientX},${event.clientY}`);
      });

      addEventListener("keydown", (event) => {
        if (event.code === "KeyW") held = true;
      });
      addEventListener("keyup", (event) => {
        if (event.code === "KeyW") held = false;
      });

      function step() {
        // `broken` is the regression under test: input arrives and is ignored, so
        // the player never moves. `drift` moves without input, which must not be
        // mistaken for a working control scheme.
        if (mode === "drift" || mode === "console-only" || mode === "network-only" || mode === "unhandled-rejection" || mode === "page-error" || (held && mode !== "broken")) {
          player.z += 0.05;
        }
        camera.z = player.z - 6;
        tick += 1;
      }

      requestAnimationFrame(function frame() {
        if (!fixedClock) step();
        requestAnimationFrame(frame);
      });

      function observe(id) {
        const source = id === "camera" ? camera : player;
        return {
          bounds: { height: 40, width: 40, x: 300, y: 160 },
          id,
          transform: {
            position: [source.x, source.y, source.z],
            rotation: appliedRotation,
            scale: [1, 1, 1],
          },
          visible: true,
        };
      }

      const bridge = {
        advance: async (ticks) => {
          for (let index = 0; index < ticks; index += 1) step();
          return { clock: { mode: "fixed-step", tick }, ticks };
        },
        applySetup: async (request) => {
          for (const entry of request.entities ?? []) {
            if (entry.entity !== "player") throw new Error(`Unknown entity '${entry.entity}'.`);
            if (entry.transform.position) {
              [player.x, player.y, player.z] = entry.transform.position;
            }
            if (entry.transform.rotation) {
              appliedRotation = entry.transform.rotation;
            }
            if (entry.frozen === true) {
              placedFrozen = true;
            }
          }
        },
        describe: () => ({
          capabilities: [
            "camera.observe",
            "entity.bounds",
            "entity.observe",
            "entity.setup",
            "runtime.resources",
            ...(fixedClock ? ["runtime.fixedStep"] : []),
            ...(mode === "physics" ? ["runtime.physics"] : []),
            ...(mode === "startup-delayed" || mode === "startup-stuck" ? ["runtime.startup"] : []),
          ],
          limits: {
            maxEntitiesPerSample: 100,
            maxEventsPerDrain: 1000,
            maxPayloadBytes: 1000000,
            operationTimeoutMs: 5000,
          },
          name: "fixture",
          protocolVersion: mode === "wrong-protocol" ? 2 : 1,
        }),
        ready: () => {
          if (mode === "not-ready") return { ready: false, reason: "scene still loading" };
          const startupReady = startupPollsRemaining <= 0;
          if (!startupReady && Number.isFinite(startupPollsRemaining)) startupPollsRemaining -= 1;
          if (startupReady) startupReadyReported = true;
          return {
            ready: true,
            ...(mode === "startup-delayed" || mode === "startup-stuck"
              ? {
                  startup: {
                    phase: startupReady ? "ready" : "collapsing",
                    progress: startupReady ? 1 : 0.5,
                    compileSettled: startupReady,
                  },
                }
              : {}),
          };
        },
        sample: (request) => {
          sampleCount += 1;
          if (mode === "network-only" && !networkFailureSent) {
            networkFailureSent = true;
            fetch("http://127.0.0.1:1/missing-asset.js").catch(() => undefined);
          }
          if (mode === "physics" && request.label) {
            physicsDebugSeries.push({
              label: request.label,
              snapshot: {
                artifact: {
                  primitives: [{ category: "sleep", entity: "player", value: 1 }],
                },
              },
              tick,
            });
          }
          const diagnostics = runtimeDiagnostics();
          const contract = bridge.describe();
          return {
          clock: fixedClock
            ? { mode: "fixed-step", tick }
            : { mode: "render-frame", timeMs: tick * 16 },
          // `silent-drop` answers every sample with zero entities. The runner has
          // no observation to judge, and must fail rather than report a green run
          // it never actually measured.
          entities: mode === "silent-drop" ? [] : (request.entities ?? []).map(observe),
          ...(diagnostics.length === 0 ? {} : { diagnostics }),
          ...(mode === "physics" ? { physicsDebugSeries: [...physicsDebugSeries] } : {}),
            resources: mode === "wait-resource" || mode === "wait-resource-timeout"
              ? { state: { networkConnected: mode === "wait-resource" && sampleCount >= 3 } }
              : mode === "startup-delayed" || mode === "startup-stuck"
              ? { startup: { sampledBeforeReady: !startupReadyReported } }
              : {
                  bridgeContract: {
                    capabilities: [...contract.capabilities],
                    limits: { ...contract.limits },
                  },
                  fixtureRun: { sampleCount },
                },
          }},
      };

      if (!mode.startsWith("no-bridge")) {
        globalThis.__THREENATIVE_PLAYTEST_BRIDGE__ = bridge;
      }
    </script>
  </body>
</html>
